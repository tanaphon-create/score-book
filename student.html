<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#5b4bff">
<title>ดูคะแนนของฉัน · Ghost Class</title>
<link rel="icon" href="../quiz-live/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3fb; --surface:#ffffff; --surface-2:#f0f1f9; --line:#e1e3f0; --text:#151930; --muted:#656c8c;
  --brand:#5b4bff; --brand-2:#a855f7; --brand-3:#06b6d4; --brand-soft:#ecebff;
  --ok:#12a150; --ok-soft:#e3f7ea; --bad:#e11d48; --bad-soft:#fde8ee; --warn:#d97706; --warn-soft:#fdf2df; --info:#0284c7; --info-soft:#e2f3fc;
  --grad:linear-gradient(135deg,var(--brand),var(--brand-2) 55%,var(--brand-3));
  --shadow:0 1px 2px rgba(20,24,60,.05),0 8px 28px -6px rgba(40,40,120,.10);
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#080a17; --surface:#11142a; --surface-2:#191d3a; --line:#262b4c; --text:#e9ebf8; --muted:#9299ba;
  --brand:#8b7dff; --brand-2:#c084fc; --brand-3:#22d3ee; --brand-soft:#24264f;
  --ok:#4ade80; --ok-soft:#12301f; --bad:#fb7185; --bad-soft:#3a1622; --warn:#fbbf24; --warn-soft:#382b10; --info:#38bdf8; --info-soft:#102d44;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px -6px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Anuphan",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:
  radial-gradient(38% 32% at 16% 12%,color-mix(in srgb,var(--brand) 24%,transparent),transparent 70%),
  radial-gradient(34% 30% at 86% 8%,color-mix(in srgb,var(--brand-3) 20%,transparent),transparent 70%),
  radial-gradient(44% 38% at 68% 92%,color-mix(in srgb,var(--brand-2) 18%,transparent),transparent 70%)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{max-width:720px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-weight:600;color:var(--muted)}
.top i{width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hero{position:relative;text-align:center;padding:34px 22px 26px;overflow:hidden;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(2px)}
.hero::before{width:220px;height:220px;right:-70px;top:-90px;background:radial-gradient(circle,color-mix(in srgb,var(--brand-2) 38%,transparent),transparent 70%)}
.hero::after{width:200px;height:200px;left:-70px;bottom:-100px;background:radial-gradient(circle,color-mix(in srgb,var(--brand-3) 34%,transparent),transparent 70%)}
.orb{position:relative;width:76px;height:76px;margin:0 auto 14px;border-radius:26px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 14px 34px -10px color-mix(in srgb,var(--brand) 70%,transparent);animation:bob 4s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-8px;border-radius:32px;border:2px solid color-mix(in srgb,var(--brand) 35%,transparent);animation:ping 2.8s ease-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes ping{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.25)}}
.hero h1{position:relative;margin:0 0 6px;font-size:28px;line-height:1.3;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{position:relative;margin:0 auto 20px;max-width:420px;color:var(--muted)}
.sbox{position:relative;display:flex;align-items:center;gap:6px;max-width:520px;margin:0 auto;padding:6px;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);transition:border-color .2s,box-shadow .25s,transform .25s var(--ease)}
.sbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 16%,transparent),var(--shadow);transform:translateY(-1px)}
.sbox>svg{flex:none;margin-left:12px;color:var(--muted)}
.sbox input{flex:1;min-width:0;height:50px;border:0;outline:0;background:transparent;font-size:19px;font-weight:500;letter-spacing:.05em;font-variant-numeric:tabular-nums;padding:0 6px}
.sbox input::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent);font-weight:400;letter-spacing:0;font-size:16px}
.clr{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--surface-2);color:var(--muted);cursor:pointer;display:none;place-items:center;font-size:15px}
.sbox.has .clr{display:grid}
.go{flex:none;height:50px;border:0;border-radius:17px;padding:0 24px;font-weight:700;color:#fff;background:var(--grad);background-size:160% 160%;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--ease),background-position .4s,opacity .2s}
.go:hover{background-position:100% 50%}.go:active{transform:scale(.96)}.go:disabled{opacity:.6}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot .7s linear infinite;display:none}
.go.busy .spin{display:block}.go.busy .arrow{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
.feats{position:relative;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0 4px}
.feat{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--brand) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 16%,var(--line));font-size:13.5px;font-weight:600;color:var(--text)}
.feat svg{color:var(--brand)}
.tip{position:relative;margin:12px 0 0;font-size:13px;color:var(--muted)}
.msg{max-width:520px;margin:14px auto 0;padding:12px 14px;border-radius:14px;font-weight:500;display:none;text-align:left;align-items:center;gap:10px}
.msg.show{display:flex;animation:rise .35s var(--ease)}.msg.err{background:var(--bad-soft);color:var(--bad)}.msg.info{background:var(--info-soft);color:var(--info)}
.skel{margin-top:16px;padding:20px;display:none}.skel.show{display:block}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--surface-2) 25%,color-mix(in srgb,var(--brand) 10%,var(--surface-2)) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.again{display:flex;justify-content:center;margin-top:4px}
.again button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 20px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.result{margin-top:16px;display:grid;gap:16px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.res{overflow:hidden;animation:rise .45s var(--ease) backwards}
.res-head{padding:18px 20px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line)}
.avatar{width:52px;height:52px;flex:none;border-radius:16px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.res-head h2{margin:0;font-size:18px;line-height:1.35}
.res-head small{color:var(--muted);display:block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.kpi{background:var(--surface);padding:14px 10px;text-align:center}
.kpi small{color:var(--muted);display:block;font-size:12.5px}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums}
.kpi b i{font-style:normal;font-size:13px;color:var(--muted);font-weight:500}
.grade{display:inline-grid;place-items:center;min-width:44px;height:34px;border-radius:10px;font-weight:700;font-size:20px;padding:0 8px}
.g4{background:var(--ok-soft);color:var(--ok)}.g3{background:var(--info-soft);color:var(--info)}.g2{background:var(--warn-soft);color:var(--warn)}.g1,.g0{background:var(--bad-soft);color:var(--bad)}
.sec{padding:16px 20px;border-top:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 span{font-size:13px;color:var(--muted);font-weight:500}
.task{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task .nm{display:flex;align-items:center;gap:7px;min-width:0}
.task .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.task b{font-variant-numeric:tabular-nums;font-size:15px}
.task b.none{color:var(--muted);font-weight:500}
.bar{grid-column:1/-1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:var(--grad);transform-origin:left;animation:gx .7s var(--ease) backwards}
@keyframes gx{from{transform:scaleX(0)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 11px;border-radius:99px;font-weight:600;font-size:13.5px;background:var(--surface-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.info{background:var(--info-soft);color:var(--info)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{display:flex;flex-direction:column;align-items:center;min-width:52px;padding:5px 6px;border-radius:10px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.day b{font-size:14px;margin-top:1px}
.day.P b{color:var(--ok)}.day.A{background:var(--bad-soft)}.day.A b{color:var(--bad)}.day.L b{color:var(--info)}.day.S b{color:var(--warn)}
.bn{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.bn:last-child{border-bottom:0}.bn small{color:var(--muted);display:block}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--bad);font-weight:700}
.ms{margin:0 20px 16px;padding:11px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:600}
.note{color:var(--muted);font-size:13px;margin:18px 4px 0;text-align:center}
@media (max-width:480px){.go{padding:0 16px}.res-head{padding:16px}.sec{padding:14px 16px}.ms{margin:0 16px 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top"><i aria-hidden="true">✓</i>สมุดคะแนน · ตรวจสอบคะแนน</div>
  <form class="card hero" id="f" autocomplete="off" novalidate>
    <div class="orb" aria-hidden="true"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/><path d="M8.6 11.2l1.7 1.7 3.2-3.4"/></svg></div>
    <h1>ตรวจคะแนนของฉัน</h1>
    <p>พิมพ์เลขประจำตัวนักเรียน แล้วดูคะแนน เกรด และการมาเรียนของคุณได้ทันที</p>
    <div class="sbox" id="sbox">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <label for="code" style="position:absolute;left:-9999px">เลขประจำตัวนักเรียน</label>
      <input id="code" inputmode="numeric" maxlength="30" placeholder="เลขประจำตัวนักเรียน" enterkeyhint="search" autofocus>
      <button class="clr" id="clr" type="button" aria-label="ล้างช่องค้นหา">✕</button>
      <button class="go" id="go" type="submit"><span class="spin" aria-hidden="true"></span><span id="gotxt">ค้นหา</span><svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="msg" id="msg" role="alert"></div>
    <div class="feats" aria-hidden="true">
      <span class="feat"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>คะแนนทุกงาน</span>
      <span class="feat"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.8z"/></svg>เกรด</span>
      <span class="feat"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>เวลาเรียน</span>
      <span class="feat"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>คะแนนเสริม</span>
    </div>
    <p class="tip">เลขประจำตัวมีอยู่ในบัตรนักเรียนหรือใบรายชื่อของห้อง</p>
  </form>
  <div class="card skel" id="skel" aria-hidden="true"><div class="sk" style="height:54px;width:70%"></div><div class="sk" style="height:70px;margin-top:14px"></div><div class="sk" style="height:16px;margin-top:18px;width:90%"></div><div class="sk" style="height:16px;margin-top:10px;width:75%"></div><div class="sk" style="height:16px;margin-top:10px;width:82%"></div></div>
  <div class="result" id="out" aria-live="polite"></div>
  <p class="note">ข้อมูลนี้แสดงเฉพาะของนักเรียนเจ้าของเลขประจำตัวเท่านั้น · หากพบข้อผิดพลาดให้แจ้งครูผู้สอน</p>
</main>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwJsr4hqB6Xq5RRTQFFeWZ3KxaTmpXQcNg52Vn5kjouwKiX9LO9OI3TxuRU-c18e8PDuA/exec';
const CATS = {work:'#5b4bff',ex:'#0ea5e9',quiz:'#f59e0b',mid:'#ec4899',final:'#dc2626',att:'#16a34a'};
const ATT = {P:'มา',A:'ขาด',L:'ลา',S:'สาย'};
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1 = n => Math.round(n*100)/100;
const fmt = n => (n==null||isNaN(n)) ? '–' : String(r1(n));
const fmtDate = iso => new Date(iso+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'});
const gradeOf = p => p>=80?'4':p>=75?'3.5':p>=70?'3':p>=65?'2.5':p>=60?'2':p>=55?'1.5':p>=50?'1':'0';

function show(kind, text){ const m=$('msg'); m.className='msg show '+kind; m.textContent=(kind==='info'?'ℹ️  ':'⚠️  ')+text; }
function hideMsg(){ $('msg').className='msg'; }

function card(r){
  const st = r.student;
  let raw = 0, max = 0;
  r.tasks.forEach(t => { max += +t.max||0; if(t.score!=null && t.score!=='') raw += +t.score; });
  const bonus = r.bonus.reduce((a,b)=>a+(+b.pts||0),0);
  const total = raw + bonus;
  const pct = max ? Math.min(100, total/max*100) : 0;
  const grade = max ? gradeOf(pct) : null;
  const c = {P:0,A:0,L:0,S:0}; r.attendance.forEach(a=>{ if(c[a.v]!=null) c[a.v]++; });
  const days = r.attendance.length;
  const apct = days ? (c.P + c.S) / days * 100 : null;
  const ms = apct!=null && apct < 80;
  const gcls = grade ? 'g'+(grade==='3.5'?'3':grade==='2.5'?'2':grade==='1.5'?'1':grade) : '';
  const initial = [...String(st.name).replace(/^(ด\.ช\.|ด\.ญ\.|นาย|นางสาว|น\.ส\.|นาง)/,'').trim()][0] || '?';
  return `<article class="card res">
    <div class="res-head"><div class="avatar" aria-hidden="true">${esc(initial)}</div>
      <div><h2>${esc(st.name)}</h2><small>เลขที่ ${esc(st.no)} · รหัส ${esc(st.code)}</small><small>${esc(r.cls)}${r.subject?' · '+esc(r.subject):''}</small></div></div>
    <div class="kpis">
      <div class="kpi"><small>คะแนนรวม</small><b>${fmt(total)}<i> / ${fmt(max)}</i></b></div>
      <div class="kpi"><small>ร้อยละ</small><b>${max?fmt(pct)+'%':'–'}</b></div>
      <div class="kpi"><small>เกรด</small>${grade?`<span class="grade ${gcls}">${grade}</span>`:'<b>–</b>'}</div>
    </div>
    ${ms?`<div class="ms" style="margin-top:14px">เวลาเรียนต่ำกว่า 80% (เสี่ยง มส) — กรุณาติดต่อครูผู้สอน</div>`:''}
    <div class="sec"><h3>คะแนนรายงาน <span>${fmt(raw)} / ${fmt(max)}${bonus?` · เสริม ${bonus>0?'+':''}${fmt(bonus)}`:''}</span></h3>
      ${r.tasks.length ? r.tasks.map(t=>{ const has=t.score!=null&&t.score!==''; const p=has&&+t.max?Math.min(100,+t.score/+t.max*100):0;
        return `<div class="task"><div class="nm"><i class="dot" style="background:${CATS[t.cat]||'#999'}"></i><span>${esc(t.name)}</span></div>
        <b class="${has?'':'none'}">${has?fmt(+t.score)+' / '+fmt(+t.max):'ยังไม่มีคะแนน'}</b><div class="bar"><span style="width:${p}%"></span></div></div>`; }).join('') : '<span style="color:var(--muted)">ยังไม่มีงาน</span>'}
    </div>
    <div class="sec"><h3>การมาเรียน <span>${days?days+' วัน':''}</span></h3>
      ${days ? `<div class="chips"><span class="chip ${apct<80?'bad':'ok'}">มาเรียน ${fmt(apct)}%</span><span class="chip ok">มา ${c.P}</span><span class="chip warn">สาย ${c.S}</span><span class="chip info">ลา ${c.L}</span><span class="chip bad">ขาด ${c.A}</span></div>
      <div class="days">${r.attendance.slice(-40).map(a=>`<div class="day ${a.v}">${fmtDate(a.d)}<b>${ATT[a.v]||a.v}</b></div>`).join('')}</div>` : '<span style="color:var(--muted)">ยังไม่มีข้อมูลเช็คชื่อ</span>'}
    </div>
    <div class="sec"><h3>คะแนนเสริม <span>${r.bonus.length?'รวม '+(bonus>0?'+':'')+fmt(bonus):''}</span></h3>
      ${r.bonus.length ? r.bonus.slice().reverse().map(b=>`<div class="bn"><div>${esc(b.reason||'คะแนนเสริม')}<small>${b.date?fmtDate(b.date):''}</small></div><span class="${b.pts<0?'minus':'plus'}">${b.pts>0?'+':''}${fmt(+b.pts)}</span></div>`).join('') : '<span style="color:var(--muted)">ยังไม่มีคะแนนเสริม</span>'}
    </div>
  </article>`;
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('code').value.trim();
  $('out').innerHTML = ''; hideMsg();
  if(!code){ show('err','กรุณาพิมพ์เลขประจำตัวนักเรียน'); return; }
  const go = $('go'); go.disabled = true; go.classList.add('busy'); $('gotxt').textContent = 'กำลังค้นหา'; $('skel').classList.add('show');
  try{
    const r = await fetch(API_URL, {method:'POST', body: JSON.stringify({action:'student', code})});
    const j = await r.json();
    if(j.ok){ $('out').innerHTML = j.results.map(card).join('') + '<div class="again"><button type="button" id="again">ค้นหาเลขอื่น</button></div>'; $('out').scrollIntoView({behavior:'smooth',block:'start'}); }
    else show(j.error==='closed'?'info':'err', ({
      closed:'ขณะนี้ยังไม่เปิดให้ดูคะแนน กรุณารอครูประกาศ',
      notfound:'ไม่พบเลขประจำตัวนี้ ตรวจสอบตัวเลขอีกครั้ง',
      busy:'มีผู้ใช้งานจำนวนมาก กรุณารอสักครู่แล้วลองใหม่',
      code:'รูปแบบเลขประจำตัวไม่ถูกต้อง'})[j.error] || 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง');
  }catch(err){ show('err','เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่'); }
  $('skel').classList.remove('show'); go.disabled = false; go.classList.remove('busy'); $('gotxt').textContent = 'ค้นหา';
});

$('code').addEventListener('input', ()=>{ $('sbox').classList.toggle('has', !!$('code').value); hideMsg(); });
$('clr').addEventListener('click', ()=>{ $('code').value=''; $('sbox').classList.remove('has'); $('out').innerHTML=''; hideMsg(); $('code').focus(); });
document.addEventListener('click', e=>{ if(e.target.id==='again'){ $('out').innerHTML=''; $('code').value=''; $('sbox').classList.remove('has'); window.scrollTo({top:0,behavior:'smooth'}); $('code').focus(); } });
</script>
