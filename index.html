<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดคะแนนรายห้อง</title>
<meta name="description" content="บันทึกคะแนน เช็คชื่อ และคะแนนเสริม รายห้องเรียน ใช้งานได้ทันทีแม้ออฟไลน์">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3fb; --surface:#ffffff; --surface-2:#f0f1f9; --glass:rgba(255,255,255,.74); --line:#e1e3f0;
  --text:#151930; --muted:#656c8c; --brand:#5b4bff; --brand-2:#a855f7; --brand-3:#06b6d4; --brand-ink:#ffffff; --brand-soft:#ecebff;
  --ok:#12a150; --ok-soft:#e3f7ea; --bad:#e11d48; --bad-soft:#fde8ee;
  --warn:#d97706; --warn-soft:#fdf2df; --info:#0284c7; --info-soft:#e2f3fc;
  --grad:linear-gradient(135deg,var(--brand),var(--brand-2) 55%,var(--brand-3));
  --shadow:0 1px 2px rgba(20,24,60,.05),0 8px 28px -6px rgba(40,40,120,.10);
  --glow:0 8px 22px -8px color-mix(in srgb,var(--brand) 70%,transparent);
  --r:18px; --r-sm:11px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080a17; --surface:#11142a; --surface-2:#191d3a; --glass:rgba(17,20,42,.68); --line:#262b4c;
    --text:#e9ebf8; --muted:#9299ba; --brand:#8b7dff; --brand-2:#c084fc; --brand-3:#22d3ee; --brand-ink:#ffffff; --brand-soft:#24264f;
    --ok:#4ade80; --ok-soft:#12301f; --bad:#fb7185; --bad-soft:#3a1622;
    --warn:#fbbf24; --warn-soft:#382b10; --info:#38bdf8; --info-soft:#102d44;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px -6px rgba(0,0,0,.5);
    --glow:0 8px 26px -6px color-mix(in srgb,var(--brand) 80%,transparent); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080a17; --surface:#11142a; --surface-2:#191d3a; --glass:rgba(17,20,42,.68); --line:#262b4c;
  --text:#e9ebf8; --muted:#9299ba; --brand:#8b7dff; --brand-2:#c084fc; --brand-3:#22d3ee; --brand-ink:#ffffff; --brand-soft:#24264f;
  --ok:#4ade80; --ok-soft:#12301f; --bad:#fb7185; --bad-soft:#3a1622;
  --warn:#fbbf24; --warn-soft:#382b10; --info:#38bdf8; --info-soft:#102d44;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px -6px rgba(0,0,0,.5);
  --glow:0 8px 26px -6px color-mix(in srgb,var(--brand) 80%,transparent); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Anuphan",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:
  radial-gradient(38% 32% at 16% 12%,color-mix(in srgb,var(--brand) 24%,transparent),transparent 70%),
  radial-gradient(34% 30% at 86% 8%,color-mix(in srgb,var(--brand-3) 20%,transparent),transparent 70%),
  radial-gradient(44% 38% at 68% 92%,color-mix(in srgb,var(--brand-2) 18%,transparent),transparent 70%);
  animation:aurora 26s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate3d(4%,-3%,0) rotate(8deg) scale(1.1)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-right:auto;letter-spacing:-.01em}
.logo i{width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px;box-shadow:var(--glow)}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.class-pick{display:flex;gap:8px;align-items:center}
select.ctl,input.ctl,textarea.ctl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;min-height:40px;transition:border-color .15s,box-shadow .15s}
select.ctl:focus,input.ctl:focus,textarea.ctl:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
select.ctl{padding-right:28px;font-weight:600}
textarea.ctl{width:100%;min-height:140px;resize:vertical}
.btn{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;min-height:40px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s var(--ease),box-shadow .2s}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.pri{background:var(--grad);background-size:160% 160%;border-color:transparent;color:var(--brand-ink);box-shadow:var(--glow)}
.btn.pri:hover{background-position:100% 50%;box-shadow:0 10px 28px -6px color-mix(in srgb,var(--brand) 80%,transparent)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13.5px;border-radius:9px}
.icon-btn{width:40px;padding:0;justify-content:center}

/* ---------- tabs ---------- */
nav.tabs{max-width:1400px;margin:auto;padding:2px 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:1px solid transparent;background:none;padding:7px 16px;border-radius:99px;color:var(--muted);font-weight:600;white-space:nowrap;transition:color .2s,background .25s,box-shadow .25s,transform .2s var(--ease)}
nav.tabs button:hover{color:var(--text);background:var(--surface-2)}
nav.tabs button[aria-selected="true"]{color:#fff;background:var(--grad);box-shadow:var(--glow);transform:translateY(-1px)}
main{max-width:1400px;margin:auto;padding:18px 16px 70px}

/* ---------- generic ---------- */
.card{background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1}
.search{position:relative;min-width:200px;flex:1;max-width:340px}
.search input{width:100%;padding-left:36px;border-radius:99px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.info{background:var(--info-soft);color:var(--info)}
.hint{font-size:13px;color:var(--muted)}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em} h3{font-size:15px;margin:0 0 8px}
.pad{padding:16px}

/* ---------- entrance effects ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes rowIn{from{opacity:0}}
.enter>.toolbar,.enter>.stats>.card,.enter>.card,.enter>h3,.enter>.sum-top>.card,.enter>.bonus-layout>*,.enter>.stu-layout>*{animation:rise .5s var(--ease) backwards}
.enter>.stats>.card:nth-child(2){animation-delay:.05s}.enter>.stats>.card:nth-child(3){animation-delay:.1s}
.enter>.stats>.card:nth-child(4){animation-delay:.15s}.enter>.stats>.card:nth-child(5){animation-delay:.2s}
.enter>.card,.enter>.bonus-layout>*,.enter>.stu-layout>*{animation-delay:.08s}
.enter tbody tr{animation:rowIn .45s ease backwards;animation-delay:calc(80ms + var(--i,0)*16ms)}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;max-height:calc(100vh - 230px);border-radius:var(--r)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:0;text-align:center;white-space:nowrap;background:var(--surface);transition:background .15s}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-weight:600;font-size:13px;padding:9px 6px;color:var(--muted)}
.grid tfoot td{position:sticky;bottom:0;z-index:2;background:var(--surface-2);font-weight:700;padding:9px 6px;font-size:13px}
.grid .c-no{position:sticky;left:0;z-index:2;width:52px;min-width:52px;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
.grid .c-name{position:sticky;left:52px;z-index:2;text-align:left;padding:0 12px;min-width:190px;max-width:260px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.grid thead .c-no,.grid thead .c-name,.grid tfoot .c-no,.grid tfoot .c-name{z-index:4}
.grid tbody tr:hover td{background:color-mix(in srgb,var(--brand-soft) 55%,var(--surface))}
.grid tbody tr:last-child td{border-bottom:0}
.grid td.num{padding:8px 10px;font-variant-numeric:tabular-nums}
.grid .total{font-weight:700}
.name-btn{border:0;background:none;padding:6px 0;font-weight:500;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;border-radius:6px;transition:color .15s}
.name-btn:hover{color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.task-h{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:3px 8px;border-radius:9px;color:var(--text);min-width:76px;max-width:130px;margin:auto;transition:background .15s,transform .15s var(--ease)}
.task-h:hover{background:var(--brand-soft);transform:translateY(-1px)}
.task-h b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.task-h small{color:var(--muted);font-weight:500;font-size:11.5px}
.cat-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.cell{width:100%;min-width:64px;height:40px;border:0;background:transparent;text-align:center;font-variant-numeric:tabular-nums;font-size:15px;outline:none;transition:background .12s,box-shadow .12s}
.cell:focus{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand);border-radius:6px}
.cell.err{background:var(--bad-soft);color:var(--bad);font-weight:700}
.cell::placeholder{color:var(--line)}
.grade{display:inline-grid;place-items:center;min-width:38px;height:26px;border-radius:8px;font-weight:700;font-size:13.5px;padding:0 6px}
.g4{background:var(--ok-soft);color:var(--ok)} .g3{background:var(--info-soft);color:var(--info)}
.g2{background:var(--warn-soft);color:var(--warn)} .g1,.g0{background:var(--bad-soft);color:var(--bad)}
@keyframes flash{from{background:color-mix(in srgb,var(--brand) 30%,transparent)}}
.b-total.bump{animation:flash .6s ease}
.pbar{position:relative;display:inline-block;min-width:74px;padding:2px 8px;border-radius:7px;overflow:hidden;background:var(--surface-2);font-weight:600}
.pbar::before{content:"";position:absolute;inset:0;width:var(--p,0%);background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 30%,transparent),color-mix(in srgb,var(--brand-3) 34%,transparent));border-radius:7px}
.pbar span{position:relative}
.rank{display:inline-grid;place-items:center;min-width:28px;height:24px;border-radius:7px;font-weight:700;font-size:13px;color:var(--muted)}
.rank.r1{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#5b3a00}.rank.r2{background:linear-gradient(135deg,#e5e7eb,#9ca3af);color:#1f2937}.rank.r3{background:linear-gradient(135deg,#fdba74,#c2703a);color:#3b1d05}

/* ---------- attendance ---------- */
.att-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.datebox{display:flex;align-items:center;gap:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;min-width:52px;min-height:36px;font-weight:600;font-size:13.5px;color:var(--muted);border-right:1px solid var(--line);transition:background .15s,color .15s}
.seg button:hover{background:var(--surface-2);color:var(--text)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].P{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].A{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].L{background:var(--info);color:#fff}
.seg button[aria-pressed="true"].S{background:var(--warn);color:#fff}
@keyframes pop{40%{transform:scale(1.18)}}
.seg button.pop{animation:pop .3s var(--ease)}
.att-list td{padding:6px 10px}
.att-list td.c-name{padding:0 12px}
.dot{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:12px;font-weight:700}
.dot.P{background:var(--ok-soft);color:var(--ok)} .dot.A{background:var(--bad);color:#fff}
.dot.L{background:var(--info-soft);color:var(--info)} .dot.S{background:var(--warn-soft);color:var(--warn)}
.date-h{border:0;background:none;color:inherit;font:inherit;font-weight:600;padding:2px 6px;border-radius:7px}
.date-h:hover,.date-h.on{background:var(--brand-soft);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{position:relative;padding:14px 16px;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow),var(--glow)}
.stat::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--grad);opacity:.7}
.stat small{color:var(--muted);font-weight:500;display:block}
.stat b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- bonus ---------- */
.bonus-layout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.quick{display:flex;gap:6px;justify-content:flex-end;padding:6px 10px}
.quick .btn{min-width:44px;justify-content:center}
.plus{color:var(--ok);font-weight:700} .minus{color:var(--bad);font-weight:700}
.log{max-height:calc(100vh - 260px);overflow:auto}
.log-item{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.log-item:last-child{border-bottom:0}
.log-item .who{flex:1;min-width:0}
.log-item .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-item .who small{color:var(--muted)}
.pts{font-weight:700;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
@keyframes fly{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-14px) scale(1.25)}100%{opacity:0;transform:translateY(-64px) scale(1)}}
.fly{position:fixed;z-index:200;pointer-events:none;font-weight:800;font-size:20px;animation:fly .9s var(--ease) forwards;text-shadow:0 2px 10px color-mix(in srgb,currentColor 40%,transparent)}

/* ---------- summary ---------- */
.sum-top{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:12px;margin-bottom:16px}
.ring-card{display:flex;align-items:center;gap:16px;padding:16px 18px}
.ring{width:104px;height:104px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .trk{stroke:var(--surface-2)}
@keyframes ring{from{stroke-dashoffset:239}}
.ring .val{stroke:url(#rg);stroke-dasharray:239;animation:ring 1.1s var(--ease) backwards}
.ring-wrap{position:relative;flex:none}
.ring-wrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;letter-spacing:-.02em}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bars i{display:block;width:100%;max-width:46px;border-radius:8px 8px 3px 3px;min-height:3px;transform-origin:bottom;animation:grow .8s var(--ease) backwards}
@keyframes grow{from{transform:scaleY(0)}}
.bars b{font-size:13px;font-variant-numeric:tabular-nums}
.bars small{font-size:12px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}

/* ---------- students ---------- */
.stu-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.stu-in{border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 9px;width:100%}
.stu-in:hover{border-color:var(--line)}
.stu-in:focus{border-color:var(--brand);background:var(--surface);outline:none}

/* ---------- student card ---------- */
.stu-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.stu-head>div:nth-child(2){flex:1;min-width:0}
.stu-head h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
.avatar{width:52px;height:52px;flex:none;border-radius:16px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;box-shadow:var(--glow)}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.mini-stats div{background:var(--surface-2);border-radius:12px;padding:8px 10px;text-align:center}
.mini-stats small{display:block;color:var(--muted);font-size:12px}
.mini-stats b{font-size:19px;font-variant-numeric:tabular-nums}
.mini-stats b i{font-style:normal;font-size:12px;color:var(--muted);font-weight:500}
.task-list{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;max-height:220px;overflow:auto}
.task-row{display:grid;grid-template-columns:minmax(80px,1.2fr) 2fr auto;gap:10px;align-items:center;font-size:14px}
.task-row>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-row b{font-variant-numeric:tabular-nums;font-size:13.5px;min-width:64px;text-align:right}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:var(--grad);transform-origin:left;animation:growx .7s var(--ease) backwards}
@keyframes growx{from{transform:scaleX(0)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

/* ---------- random picker ---------- */
.rand{position:relative;text-align:center;padding:28px 10px;border-radius:16px;background:var(--surface-2);margin-bottom:14px;overflow:hidden}
.rand-name{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.rand-sub{color:var(--muted);margin-top:4px}
.rand.win{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.rand.win .rand-sub{color:rgba(255,255,255,.85)}
.rand.win .rand-name{animation:pop .5s var(--ease)}
.conf{position:absolute;left:50%;top:50%;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:conf 1.2s var(--ease) forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--rot));opacity:0}}

/* ---------- empty ---------- */
.empty{text-align:center;padding:56px 20px}
.empty .big{font-size:50px;line-height:1;display:inline-block;animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}
.empty h2{font-size:22px;margin:14px 0 6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:420px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- dialog / menu / toast ---------- */
dialog{border:1px solid var(--line);border-radius:22px;padding:0;background:var(--surface);color:var(--text);box-shadow:0 30px 80px -10px rgba(0,0,20,.45);width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog.wide{width:min(560px,calc(100vw - 32px))}
dialog[open]{animation:dlg .32s var(--ease)}
@keyframes dlg{from{opacity:0;transform:translateY(18px) scale(.96)}}
dialog::backdrop{background:rgba(8,10,25,.5);backdrop-filter:blur(4px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.dlg{padding:20px}
.dlg h2{margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13.5px;font-weight:600}
.field .ctl{width:100%}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.dlg-foot .left{margin-right:auto}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;min-width:250px;z-index:30;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);transform-origin:top right;transition:opacity .18s,transform .22s var(--ease),visibility .18s}
.menu-pop.open{opacity:1;visibility:visible;transform:none}
.menu-pop button,.menu-pop label{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;padding:9px 12px;border-radius:10px;text-align:left;cursor:pointer;font-size:14px}
.menu-pop button:hover,.menu-pop label:hover{background:var(--surface-2)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(24px) scale(.96);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s var(--ease);z-index:100;display:flex;gap:12px;align-items:center;box-shadow:0 12px 34px -8px rgba(0,0,20,.5);max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{border:0;background:none;color:var(--brand-3);font-weight:700;padding:0}
.saved{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:99px;transition:background .15s,color .15s}
.saved:hover{background:var(--surface-2);color:var(--text)}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,currentColor 12%,transparent)}
.saved[data-kind="syncing"] i,.saved[data-kind="loading"] i{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

@media (max-width:900px){
  .bonus-layout,.stu-layout,.sum-top{grid-template-columns:1fr}
  .tbl-wrap{max-height:none}
  .log{max-height:360px}
}
@media (max-width:560px){
  .logo span{display:none}
  .grid .c-name{min-width:130px;max-width:150px;padding:0 8px;left:40px}
  .grid .c-no{width:40px;min-width:40px}
  .seg button{min-width:42px;padding:6px 8px}
  .saved{max-width:44px;overflow:hidden;white-space:nowrap;padding:6px 16px}
  .mini-stats{grid-template-columns:repeat(2,1fr)}
  .rand-name{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  body::before,header.top,.toolbar,.no-print{display:none!important}
  .tbl-wrap{max-height:none;overflow:visible}
  .card{box-shadow:none;backdrop-filter:none;background:#fff}
}
</style>

<body>
<header class="top">
  <div class="top-in">
    <div class="logo"><i aria-hidden="true">✓</i><span>สมุดคะแนน</span></div>
    <div class="class-pick" id="classPick"></div>
    <button class="saved" id="saved" data-act="connect" aria-live="polite" title="ตั้งค่าการเชื่อมต่อ Google Sheet"><i></i>บันทึกอัตโนมัติ</button>
    <div class="menu">
      <button class="btn icon-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="เมนูเพิ่มเติม">⋯</button>
      <div class="menu-pop" id="menuPop" role="menu">
        <button data-act="newClass" role="menuitem">＋ เพิ่มห้องเรียน</button>
        <button data-act="editClass" role="menuitem">✎ แก้ไขชื่อห้อง/วิชา</button>
        <hr>
        <button data-act="random" role="menuitem">🎲 สุ่มชื่อนักเรียน</button>
        <hr>
        <button data-act="xlsx" role="menuitem">⬇ ส่งออก Excel / Google Sheet (.xlsx)</button>
        <button data-act="csv" role="menuitem">⬇ ส่งออกแบบ CSV</button>
        <button data-act="backup" role="menuitem">💾 สำรองข้อมูลทั้งหมด (.json)</button>
        <label role="menuitem">📂 กู้คืนจากไฟล์สำรอง<input type="file" accept=".json,application/json" id="restoreFile" hidden></label>
        <button data-act="print" role="menuitem">🖨 พิมพ์หน้านี้</button>
        <hr>
        <button data-act="connect" role="menuitem">🔗 เชื่อมต่อ Google Sheet</button>
        <button data-act="openSheet" role="menuitem">📊 เปิด Google Sheet</button>
        <button data-act="theme" role="menuitem">◐ สลับโหมดมืด/สว่าง</button>
        <button data-act="delClass" role="menuitem" class="danger" style="color:var(--bad)">🗑 ลบห้องนี้</button>
      </div>

  <nav class="tabs" role="tablist" id="tabs" aria-label="ส่วนของสมุดคะแนน">

    <button role="tab" data-tab="att">📅 เช็คชื่อ</button>
    <button role="tab" data-tab="bonus">⭐ คะแนนเสริม</button>
    <button role="tab" data-tab="sum">📊 สรุปผล</button>

  </nav>
</header>

<main id="view" tabindex="-1"></main>

<dialog id="dlg"><form method="dialog" class="dlg" id="dlgForm"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ================= state ================= */
const KEY = 'scorebook.v1';
const CATS = {
  work:  {name:'งาน/การบ้าน', color:'#4f46e5'},
  ex:    {name:'แบบฝึกหัด',  color:'#0ea5e9'},
  quiz:  {name:'สอบย่อย',    color:'#f59e0b'},
  mid:   {name:'สอบกลางภาค', color:'#ec4899'},
  final: {name:'สอบปลายภาค', color:'#dc2626'},
  att:   {name:'จิตพิสัย',    color:'#16a34a'}
};
const ATT = {P:'มา', A:'ขาด', L:'ลา', S:'สาย'};
const GRADE_COLORS = {'4':'#16a34a','3.5':'#22c55e','3':'#0ea5e9','2.5':'#38bdf8','2':'#f59e0b','1.5':'#fb923c','1':'#f87171','0':'#dc2626'};

let S = load();
let tab = 'scores';
let attDate = today();
let query = '';
let bonusReason = 'ตอบคำถาม';
let undoFn = null;

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.classes)) return d; }catch(e){}
  return {classes:[], cur:null};
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    if(API) syncSoon(); else setStatus('local');
  }, 200);
}

/* ---------- Google Sheet sync (Apps Script web app) ---------- */
const API_KEY = 'scorebook.api', BASE_KEY = 'scorebook.syncbase';
// ลิงก์ฐานข้อมูลของครูธนพล — ฝังไว้ เครื่องใหม่จึงใส่แค่ PIN (ไม่มี PIN อ่าน/เขียนไม่ได้)
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwJsr4hqB6Xq5RRTQFFeWZ3KxaTmpXQcNg52Vn5kjouwKiX9LO9OI3TxuRU-c18e8PDuA/exec';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1dmwEbCLtZ-Dvk5Z0OrJIEeLO1vRvEuklAe-U9e9N9g4/edit';
let API = (()=>{ try{ const a=JSON.parse(localStorage.getItem(API_KEY)); return a&&a.url ? a : null; }catch(e){ return null; } })();
let base = (()=>{ try{ return JSON.parse(localStorage.getItem(BASE_KEY))||{}; }catch(e){ return {}; } })();
let syncTimer, syncing = false, syncAgain = false, lastErr = null;
const hash = s => { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36)+'.'+s.length; };
const metaObj = () => ({cur:S.cur, order:S.classes.map(c=>c.id)});
function setStatus(kind, extra){
  const el = document.getElementById('saved');
  const t = new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  const m = {
    local:   ['var(--warn)', 'บันทึกในเครื่องนี้ · เชื่อม Google Sheet'],
    syncing: ['var(--info)', 'กำลังบันทึกลง Google Sheet…'],
    loading: ['var(--info)', 'กำลังโหลดจาก Google Sheet…'],
    ok:      ['var(--ok)',   'บันทึกลง Google Sheet แล้ว ' + t],
    err:     ['var(--bad)',  '⚠ ยังไม่ได้บันทึกลง Sheet (' + (extra||'ออฟไลน์') + ') · ลองใหม่']
  }[kind];
  el.innerHTML = `<i style="background:${m[0]}"></i>${m[1]}`;
  el.dataset.kind = kind;
}
async function api(body){
  const r = await fetch(API.url, {method:'POST', body: JSON.stringify({...body, pin: API.pin})});
  let j; try{ j = await r.json(); }catch(e){ throw {error:'bad_response'}; }
  if(!j.ok) throw j;
  return j;
}
function pending(){
  const changed = S.classes.filter(c => base[c.id] !== hash(JSON.stringify(c)));
  const deleted = Object.keys(base).filter(id => id!=='__meta' && !S.classes.some(c=>c.id===id));
  const metaChanged = base.__meta !== hash(JSON.stringify(metaObj()));
  return {changed, deleted, metaChanged, any: changed.length || deleted.length || metaChanged};
}
function syncSoon(){ clearTimeout(syncTimer); setStatus('syncing'); syncTimer = setTimeout(syncNow, 1200); }
async function syncNow(){
  if(!API) return;
  if(syncing){ syncAgain = true; return; }
  const p = pending();
  if(!p.any){ setStatus('ok'); return; }
  syncing = true; setStatus('syncing');
  const sent = p.changed.map(c => JSON.stringify(c));
  const meta = metaObj(), metaStr = JSON.stringify(meta);
  try{
    await api({action:'save', classes: sent.map(s=>JSON.parse(s)), deleted: p.deleted, meta});
    p.changed.forEach((c,i)=> base[c.id] = hash(sent[i]));
    p.deleted.forEach(id => delete base[id]);
    base.__meta = hash(metaStr);
    try{ localStorage.setItem(BASE_KEY, JSON.stringify(base)); }catch(e){}
    lastErr = null; setStatus('ok');
  }catch(e){
    lastErr = e; setStatus('err', e?.error==='pin' ? 'รหัสไม่ถูกต้อง' : 'ออฟไลน์');
    clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 30000);   // retry later
  }
  syncing = false;
  if(syncAgain){ syncAgain = false; syncNow(); }
}
async function pullFromSheet(){
  if(!API || syncing) return;
  if(pending().any){ await syncNow(); if(lastErr) return; }
  setStatus('loading');
  try{
    const j = await api({action:'load'});
    const list = j.classes || [], order = j.meta?.order || [];
    list.sort((a,b)=>(order.indexOf(a.id)+1||1e9)-(order.indexOf(b.id)+1||1e9));
    if(pending().any) return syncNow();           // user edited while loading; push first
    base = {}; list.forEach(c=> base[c.id] = hash(JSON.stringify(c)));
    const before = JSON.stringify(S.classes);
    S = {classes:list, cur: list.some(c=>c.id===S.cur) ? S.cur : (j.meta?.cur && list.some(c=>c.id===j.meta.cur) ? j.meta.cur : list[0]?.id || null)};
    base.__meta = hash(JSON.stringify(metaObj()));
    try{ localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(BASE_KEY, JSON.stringify(base)); }catch(e){}
    if(JSON.stringify(S.classes)!==before && !document.activeElement?.matches('input,textarea')) render();
    setStatus('ok');
  }catch(e){ lastErr = e; setStatus('err', e?.error==='pin' ? 'รหัสไม่ถูกต้อง' : 'ออฟไลน์'); }
}
function connectDialog(){
  openDialog(`<h2>เชื่อมต่อ Google Sheet</h2>
    <p class="hint" style="margin-top:0">ลิงก์ฐานข้อมูลใส่ไว้ให้แล้ว พิมพ์แค่ <b>รหัส PIN</b> แล้วกดเชื่อมต่อ (ทำครั้งเดียวต่อเครื่อง)</p>
    <div class="field"><label for="f_pin">รหัส PIN</label><input class="ctl" id="f_pin" type="password" required autofocus autocomplete="current-password" value="${esc(API?.pin||'')}"></div>
    <details class="hint" style="margin:4px 0 8px"><summary style="cursor:pointer">เปลี่ยนลิงก์ Web app (ไม่ต้องแก้ ถ้าใช้ชีตเดิม)</summary>
      <div class="field" style="margin-top:8px"><label for="f_url">ลิงก์ Web app (ลงท้ายด้วย /exec)</label><input class="ctl" id="f_url" required placeholder="https://script.google.com/macros/s/…/exec" value="${esc(API?.url||DEFAULT_API_URL)}"></div></details>
    <p class="hint" id="f_msg" role="alert"></p>
    <div class="dlg-foot">${API?'<button type="button" class="btn danger left" id="disc">ยกเลิกการเชื่อมต่อ</button>':''}<button type="button" class="btn" data-close>ปิด</button><button class="btn pri" id="f_go">เชื่อมต่อ</button></div>`,
  f=>{
    const url=f.f_url.value.trim(), pin=f.f_pin.value;
    const msg=document.getElementById('f_msg'), go=document.getElementById('f_go');
    if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)){ msg.textContent='⚠ ลิงก์ต้องเป็นของ script.google.com'; return false; }
    go.disabled=true; msg.textContent='กำลังทดสอบการเชื่อมต่อ…';
    const prev = API; API = {url, pin};
    api({action:'ping'}).then(()=>{
      try{ localStorage.setItem(API_KEY, JSON.stringify(API)); }catch(e){}
      if(!prev || prev.url!==url){ base = {}; try{ localStorage.removeItem(BASE_KEY); }catch(e){} }
      closeDialog(); toast('เชื่อมต่อ Google Sheet แล้ว'); pullFromSheet();
    }).catch(e=>{
      API = prev; go.disabled=false;
      msg.textContent = e?.error==='pin' ? '⚠ รหัส PIN ไม่ถูกต้อง' : '⚠ เชื่อมต่อไม่ได้ — ตรวจลิงก์ และตั้งสิทธิ์ Web app เป็น "Anyone"';
    });
    return false;
  });
  document.getElementById('disc')?.addEventListener('click', ()=>{
    API=null; base={}; try{ localStorage.removeItem(API_KEY); localStorage.removeItem(BASE_KEY); }catch(e){}
    closeDialog(); setStatus('local'); toast('ยกเลิกการเชื่อมต่อแล้ว (ข้อมูลยังอยู่ในเครื่องนี้)');
  });
}
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const C = () => S.classes.find(c => c.id === S.cur);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
const fmtDate = (iso, opt={day:'numeric',month:'short'}) => new Date(iso+'T00:00:00').toLocaleDateString('th-TH', opt);
const r1 = n => Math.round(n*100)/100;
const fmt = n => (n==null||isNaN(n)) ? '–' : (Number.isInteger(r1(n)) ? String(r1(n)) : r1(n).toFixed(r1(n)*10%1?2:1));

function newClass(name, subject){
  return {id:uid(), name, subject:subject||'', students:[], tasks:[], scores:{}, attendance:{}, bonus:[]};
}
function sortedStudents(c){
  return [...c.students].sort((a,b)=>(+a.no||9999)-(+b.no||9999) || a.name.localeCompare(b.name,'th'));
}
function visibleStudents(c){
  const q = query.trim().toLowerCase();
  const list = sortedStudents(c);
  return q ? list.filter(s => (s.name+' '+s.code+' '+s.no).toLowerCase().includes(q)) : list;
}

/* ================= calculations ================= */
function gradeOf(p){
  if(p>=80) return '4'; if(p>=75) return '3.5'; if(p>=70) return '3'; if(p>=65) return '2.5';
  if(p>=60) return '2'; if(p>=55) return '1.5'; if(p>=50) return '1'; return '0';
}
function bonusOf(c, sid){ let t=0; for(const b of c.bonus) if(b.sid===sid) t+=b.pts; return t; }
function attOf(c, sid){
  const r = {P:0,A:0,L:0,S:0,days:0};
  for(const d in c.attendance){ const v=c.attendance[d][sid]; if(v){ r[v]++; r.days++; } }
  r.pct = r.days ? (r.P + r.S) / r.days * 100 : null;
  return r;
}
function maxTotal(c){ return c.tasks.reduce((a,t)=>a+(+t.max||0),0); }
function statOf(c, s){
  let raw = 0;
  for(const t of c.tasks){ const v = c.scores[t.id]?.[s.id]; if(v!=null && v!=='') raw += +v; }
  const bonus = bonusOf(c, s.id);
  const max = maxTotal(c);
  const total = raw + bonus;
  const pct = max ? Math.min(100, total/max*100) : 0;
  const att = attOf(c, s.id);
  const ms = att.pct!=null && att.pct < 80;
  return {raw, bonus, total, max, pct, grade: max ? gradeOf(pct) : null, att, ms};
}

/* ================= render shell ================= */
function render(){
  renderClassPick();
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.setAttribute('aria-selected', b.dataset.tab===tab);
  });
  const c = C();
  document.getElementById('tabs').style.display = c ? '' : 'none';
  const v = document.getElementById('view');
  if(!c){ v.innerHTML = emptyView(); return; }
  ({scores:viewScores, att:viewAtt, bonus:viewBonus, sum:viewSum, stu:viewStu})[tab](v, c);
}
function renderClassPick(){
  const el = document.getElementById('classPick');
  if(!S.classes.length){ el.innerHTML=''; return; }
  el.innerHTML = `<label class="sr" for="classSel">เลือกห้องเรียน</label>
    <select class="ctl" id="classSel">${S.classes.map(c=>`<option value="${c.id}" ${c.id===S.cur?'selected':''}>${esc(c.name)}${c.subject?' · '+esc(c.subject):''}</option>`).join('')}</select>
    <button class="btn icon-btn" data-act="newClass" title="เพิ่มห้องเรียน" aria-label="เพิ่มห้องเรียน">＋</button>`;
}
function emptyView(){
  return `<div class="card empty">
    <div class="big" aria-hidden="true">📚</div>
    <h2>เริ่มสมุดคะแนนเล่มแรก</h2>
    <p>สร้างห้องเรียน เพิ่มรายชื่อนักเรียน แล้วเริ่มกรอกคะแนน เช็คชื่อ และให้คะแนนเสริมได้ทันที ข้อมูลบันทึกอัตโนมัติในเครื่องนี้</p>
    <div class="row">
      <button class="btn pri" data-act="newClass">＋ สร้างห้องเรียน</button>
      <button class="btn" data-act="demo">ลองด้วยข้อมูลตัวอย่าง</button>
    </div></div>`;
}
const searchBox = () => `<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <label class="sr" for="q">ค้นหานักเรียน</label><input class="ctl" id="q" placeholder="ค้นหาชื่อ / เลขที่" value="${esc(query)}"></div>`;
const noStudents = () => `<div class="card empty"><div class="big" aria-hidden="true">👥</div><h2>ยังไม่มีรายชื่อนักเรียน</h2>
  <p>เพิ่มรายชื่อทีละคน หรือวางรายชื่อจาก Excel ได้ทีเดียวทั้งห้อง</p>
  <div class="row"><button class="btn pri" data-goto="stu">ไปที่หน้าเพิ่มนักเรียน</button></div></div>`;

/* ================= scores ================= */
function viewScores(v, c){
  if(!c.students.length){ v.innerHTML = noStudents(); return; }
  const list = visibleStudents(c);
  const max = maxTotal(c);
  v.innerHTML = `
  <div class="toolbar">
    ${searchBox()}
    <span class="hint grow"><kbd>Enter</kbd> ลงคนถัดไป · ลูกศรเลื่อนช่อง · วางคะแนนทั้งคอลัมน์จาก Excel ได้</span>
    <button class="btn pri" data-act="addTask">＋ เพิ่มงาน</button>
  </div>
  ${!c.tasks.length ? `<div class="card empty"><div class="big" aria-hidden="true">📝</div><h2>ยังไม่มีงาน</h2><p>เพิ่มงาน การบ้าน หรือการสอบ พร้อมคะแนนเต็ม แล้วกรอกคะแนนได้ทันที</p><div class="row"><button class="btn pri" data-act="addTask">＋ เพิ่มงานแรก</button></div></div>` : `
  <div class="card tbl-wrap">
  <table class="grid" id="scoreGrid">
    <thead><tr>
      <th class="c-no">ที่</th><th class="c-name" style="text-align:left">ชื่อ-สกุล</th>

const gradeBadge = g => g==null ? '–' : `<span class="grade g${Math.floor(+g)}">${g}</span>`;
function taskAvg(c,t){
  const vals = c.students.map(s=>c.scores[t.id]?.[s.id]).filter(v=>v!=null&&v!=='').map(Number);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function classAvg(c,key){
  if(!c.students.length) return null;
  return c.students.reduce((a,s)=>a+statOf(c,s)[key],0)/c.students.length;
}
function onScoreInput(inp){
  const c = C(); const tid = inp.dataset.t; const sid = inp.closest('tr').dataset.sid;
  const t = c.tasks.find(x=>x.id===tid);
  let raw = inp.value.trim().replace(',', '.');
  if(raw===''){ if(c.scores[tid]) delete c.scores[tid][sid]; inp.classList.remove('err'); }
  else{
    const n = Number(raw);
    if(isNaN(n) || n<0){ inp.classList.add('err'); return; }
    inp.classList.toggle('err', n > +t.max);
    (c.scores[tid] ||= {})[sid] = n;
  }
  const tr = inp.closest('tr'); const s = c.students.find(x=>x.id===sid); const st = statOf(c,s);
  const bt = tr.querySelector('.b-total'); bt.textContent = fmt(st.total); bt.classList.remove('bump'); void bt.offsetWidth; bt.classList.add('bump');
  tr.querySelector('.b-pct').textContent = fmt(st.pct);
  tr.querySelector('.b-grade').innerHTML = gradeBadge(st.grade);
  const avg = document.querySelector(`[data-avg="${tid}"]`); if(avg) avg.textContent = fmt(taskAvg(c,t));
  document.getElementById('avgTotal').textContent = fmt(classAvg(c,'total'));
  document.getElementById('avgPct').textContent = fmt(classAvg(c,'pct'));
  save();
}
function moveCell(from, dr, dc){
  const r = +from.dataset.r + dr, ci = +from.dataset.c + dc;
  const next = document.querySelector(`#scoreGrid .cell[data-r="${r}"][data-c="${ci}"]`);
  if(next){ next.focus(); next.select(); return true; }
  return false;
}

function taskDialog(task){
  const c = C(); const isNew = !task;
  task ||= {name:'งานที่ '+(c.tasks.length+1), max:10, cat:'work'};
  openDialog(`<h2>${isNew?'เพิ่มงานใหม่':'แก้ไขงาน'}</h2>
    <div class="field"><label for="f_name">ชื่องาน</label><input class="ctl" id="f_name" required maxlength="60" value="${esc(task.name)}"></div>
    <div class="field"><label for="f_max">คะแนนเต็ม</label><input class="ctl" id="f_max" type="number" min="0.5" step="0.5" required value="${task.max}"></div>
    <div class="field"><label for="f_cat">ประเภท</label><select class="ctl" id="f_cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===task.cat?'selected':''}>${v.name}</option>`).join('')}</select></div>
    ${isNew?'':'<p style="margin:0 0 12px"><button type="button" class="btn sm" id="fillMax">✨ ใส่คะแนนเต็มให้คนที่ยังว่าง</button></p>'}
    <div class="dlg-foot">${isNew?'':'<button type="button" class="btn danger left" id="delTask">ลบงานนี้</button>'}
      <button type="button" class="btn" value="cancel" data-close>ยกเลิก</button><button class="btn pri" value="ok">บันทึก</button></div>`,
    f=>{
      const name=f.f_name.value.trim(), max=+f.f_max.value;
      if(!name || !(max>0)) return false;
      if(isNew){ c.tasks.push({id:uid(), name, max, cat:f.f_cat.value}); }
      else Object.assign(c.tasks.find(t=>t.id===task.id), {name, max, cat:f.f_cat.value});
      save(); render();
      if(isNew) setTimeout(()=>{ const ci=c.tasks.length-1; const el=document.querySelector(`#scoreGrid .cell[data-r="0"][data-c="${ci}"]`); el?.focus(); el?.scrollIntoView({block:'nearest',inline:'center'}); },30);
    });
  document.getElementById('f_name').select();
  document.getElementById('fillMax')?.addEventListener('click', ()=>{
    const sc = (c.scores[task.id] ||= {}); const filled = [];
    c.students.forEach(s=>{ if(sc[s.id]==null || sc[s.id]===''){ sc[s.id] = +task.max; filled.push(s.id); } });
    closeDialog(); save(); render();
    toast(`ใส่คะแนนเต็มให้ ${filled.length} คน`, ()=>{ filled.forEach(id=>delete sc[id]); save(); render(); });
  });
  document.getElementById('delTask')?.addEventListener('click', ()=>{
    const idx = c.tasks.findIndex(t=>t.id===task.id); const removed = c.tasks[idx]; const sc = c.scores[task.id];
    c.tasks.splice(idx,1); delete c.scores[task.id]; closeDialog(); save(); render();
    toast(`ลบ “${removed.name}” แล้ว`, ()=>{ c.tasks.splice(idx,0,removed); if(sc) c.scores[removed.id]=sc; save(); render(); });
  });
}

  const rows = all.filter(x=>vis.has(x.s.id));

  else if(sumSort==='att') rows.sort((a,b)=>(a.st.att.pct??101)-(b.st.att.pct??101));
  const dist = {}; Object.keys(GRADE_COLORS).forEach(g=>dist[g]=0);
  all.forEach(x=>{ if(x.st.grade) dist[x.st.grade]++; });

  const avg = classAvg(c,'pct') || 0;
  const passed = all.filter(x=>x.st.grade && +x.st.grade>=1 && !x.st.ms).length;
  const missing = all.filter(x=>c.tasks.some(t=>{ const val=c.scores[t.id]?.[x.s.id]; return val==null||val===''; })).length;
  const catTotals = {};
  c.tasks.forEach(t=>{ catTotals[t.cat]=(catTotals[t.cat]||0)+(+t.max); });
  v.innerHTML = `

      <option value="low" ${sumSort==='low'?'selected':''}>คะแนนน้อย → มาก</option>
      <option value="att" ${sumSort==='att'?'selected':''}>มาเรียนน้อยสุดก่อน</option>
    </select>
    <div class="grow"></div><button class="btn" data-act="print">🖨 พิมพ์</button><button class="btn pri" data-act="xlsx">⬇ ส่งออก Excel / Sheet</button></div>

    <td class="num">${c.tasks.length?`${sent}/${c.tasks.length}`:'–'}</td>

  </tbody></table></div>
  <p class="hint">เกณฑ์: 80+ = 4 · 75 = 3.5 · 70 = 3 · 65 = 2.5 · 60 = 2 · 55 = 1.5 · 50 = 1 · ต่ำกว่า 50 = 0 · คะแนนเสริมนำไปรวมกับคะแนนงาน (ไม่เกิน 100%) · มาเรียนนับ "มา" และ "สาย"; ต่ำกว่า 80% = มส · กดที่ชื่อเพื่อดูรายละเอียดรายคน</p>`;
}
function rankMap(all){
  const ranked = [...all].sort((a,b)=>b.st.total-a.st.total); const m = new Map();
  ranked.forEach((x,i)=> m.set(x.s.id, i && ranked[i-1].st.total===x.st.total ? m.get(ranked[i-1].s.id) : i+1));
  return m;
}

const nameBtn = s => `<button class="name-btn" data-stu="${s.id}" title="ดูรายละเอียด ${esc(s.name)}">${esc(s.name)}</button>`;
const calm = () => { try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return true; } };
function animateView(){
  const v = document.getElementById('view'); if(calm()) return;
  v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  v.querySelectorAll('tbody').forEach(tb=>[...tb.rows].slice(0,40).forEach((tr,i)=>tr.style.setProperty('--i',i)));
  v.querySelectorAll('b[data-count]').forEach(countUp);
}
function countUp(el){
  const end = +el.dataset.count; const node = el.firstChild;
  if(!isFinite(end) || !node || !window.requestAnimationFrame || !window.performance) return;
  const t0 = performance.now();
  const step = t => { const p = Math.min(1,(t-t0)/650), e = 1-Math.pow(1-p,3);
    node.textContent = p<1 ? Math.round(end*e) : fmt(end); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function floatPts(el, pts){
  if(calm() || !el?.getBoundingClientRect) return;
  const r = el.getBoundingClientRect(); const f = document.createElement('span');
  f.className = 'fly ' + (pts>=0?'plus':'minus'); f.textContent = (pts>0?'+':'')+pts;
  f.style.left = (r.left + r.width/2 - 12) + 'px'; f.style.top = (r.top - 6) + 'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(), 950);
}
function confetti(box){
  if(calm()) return;
  const colors = ['#fde047','#f472b6','#22d3ee','#a78bfa','#4ade80','#fb923c','#ffffff'];
  for(let i=0;i<28;i++){ const p = document.createElement('span'); p.className='conf';
    const a = Math.random()*Math.PI*2, d = 70+Math.random()*130;
    p.style.cssText = `background:${colors[i%colors.length]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--rot:${Math.random()*720-360}deg`;
    box.appendChild(p); setTimeout(()=>p.remove(), 1300); }
}

/* ================= random picker ================= */
function randomDialog(){
  const c = C(); if(!c) return;
  const day = c.attendance[today()] || {};
  const pool = sortedStudents(c).filter(s => s.name && !['A','L'].includes(day[s.id]));
  if(!pool.length){ toast('ยังไม่มีนักเรียนให้สุ่ม'); return; }
  openDialog(`<h2>🎲 สุ่มชื่อนักเรียน</h2>
    <div class="rand" id="randBox" aria-live="polite"><div class="rand-name" id="randName">พร้อมไหม?</div><div class="rand-sub" id="randSub">${pool.length} คน (ไม่รวมคนที่ขาด/ลาวันนี้)</div></div>
    <div class="dlg-foot"><button type="button" class="btn left" data-close>ปิด</button><button type="button" class="btn" id="randGive" disabled>⭐ +1 คะแนน</button><button type="button" class="btn pri" id="randGo">สุ่มเลย</button></div>`,
    ()=>false);
  const box=document.getElementById('randBox'), nameEl=document.getElementById('randName'), sub=document.getElementById('randSub');
  const go=document.getElementById('randGo'), give=document.getElementById('randGive');
  let picked=null, last=null;
  go.addEventListener('click', ()=>{
    go.disabled = give.disabled = true; box.classList.remove('win');
    let n=0; const total = calm() ? 1 : 16+Math.floor(Math.random()*8);
    const tick = ()=>{
      do { picked = pool[Math.floor(Math.random()*pool.length)]; } while(pool.length>1 && picked===last);
      last = picked; nameEl.textContent = picked.name; sub.textContent = 'เลขที่ ' + picked.no; n++;
      if(n<total) setTimeout(tick, 45 + n*n*0.9);
      else { box.classList.add('win'); confetti(box); go.disabled = give.disabled = false; go.textContent='สุ่มอีกครั้ง'; }
    };
    tick();
  });
  give.addEventListener('click', ()=>{ if(picked){ closeDialog(); addBonus(picked.id, 1, 'สุ่มตอบคำถาม'); } });
}
function bonusAll(pts){

/* ================= Excel / Sheet export (.xlsx) ================= */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function exportXLSX(){
  const c = C(); if(!c) return;
  toast('กำลังสร้างไฟล์ Excel…');
  try{ if(!window.ExcelJS) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'); }
  catch(e){ toast('⚠ โหลดตัวสร้าง Excel ไม่ได้ (ออฟไลน์) — ส่งออกเป็น CSV แทน'); return exportCSV(); }
  try{
    const buf = await buildWorkbook(c).xlsx.writeBuffer();
    const ok = await download(`สมุดคะแนน_${c.name.replace(/[\\/:*?"<>|]/g,'-')}_${today()}.xlsx`, buf, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    if(ok) toast('ส่งออกแล้ว — เปิดด้วย Excel หรืออัปโหลดเข้า Google Sheets ได้เลย');
  }catch(e){ console.error(e); toast('⚠ สร้างไฟล์ไม่สำเร็จ'); }
}
function buildWorkbook(c){
  const wb = new ExcelJS.Workbook(); wb.creator = 'สมุดคะแนนรายห้อง'; wb.created = new Date();
  const F = 'TH Sarabun New', SZ = 16;
  const students = sortedStudents(c), tasks = c.tasks, dates = Object.keys(c.attendance).sort(), max = maxTotal(c);
  const stats = new Map(students.map(s=>[s.id, statOf(c,s)]));
  const rankOf = rankMap(students.map(s=>({s, st:stats.get(s.id)})));
  const thin = {style:'thin', color:{argb:'FFD5D8E6'}}, border = {top:thin,left:thin,bottom:thin,right:thin};
  const fill = argb => ({type:'pattern', pattern:'solid', fgColor:{argb}});
  const L = n => { let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; };
  const GC = {'4':'FFBBF7D0','3.5':'FFDCFCE7','3':'FFBAE6FD','2.5':'FFE0F2FE','2':'FFFDE68A','1.5':'FFFED7AA','1':'FFFECACA','0':'FFFCA5A5','มส':'FFFDA4AF'};
  const AC = {'มา':null,'ขาด':'FFFECACA','ลา':'FFBAE6FD','สาย':'FFFDE68A'};
  const subText = `${c.subject?c.subject+' · ':''}นักเรียน ${students.length} คน · ส่งออกเมื่อ ${new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})}`;
  const sheet = (name, ncol, frozenCols, headRow) => {
    const ws = wb.addWorksheet(name, {views:[{state:'frozen', xSplit:frozenCols, ySplit:headRow}],
      pageSetup:{paperSize:9, orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}}});
    ws.mergeCells(1,1,1,Math.max(ncol,3)); const a = ws.getCell(1,1); a.value = `${name} — ${c.name}`;
    a.font = {name:F, size:22, bold:true, color:{argb:'FF312E81'}}; a.alignment = {vertical:'middle'}; ws.getRow(1).height = 34;
    ws.mergeCells(2,1,2,Math.max(ncol,3)); const b = ws.getCell(2,1); b.value = subText; b.font = {name:F, size:14, color:{argb:'FF656C8C'}};
    ws.pageSetup.printTitlesRow = `${headRow}:${headRow}`;
    return ws;
  };
  const head = (ws, rowNo, labels) => { const r = ws.getRow(rowNo); r.height = 46;
    labels.forEach((l,i)=>{ const x = r.getCell(i+1); x.value = l; x.font = {name:F, size:SZ, bold:true, color:{argb:'FFFFFFFF'}};
      x.fill = fill('FF4F46E5'); x.alignment = {horizontal:'center', vertical:'middle', wrapText:true}; x.border = border; }); };
  const put = (ws, rowNo, vals, o={}) => { const r = ws.getRow(rowNo);
    vals.forEach((val,i)=>{ const x = r.getCell(i+1); x.value = val; x.font = {name:F, size:SZ, bold:!!o.bold}; x.border = border;
      x.alignment = {horizontal:(o.left||[]).includes(i)?'left':'center', vertical:'middle'};
      if(o.fill) x.fill = fill(o.fill); else if(o.zebra) x.fill = fill('FFF6F7FC'); });
    return r; };
  const widths = (ws, arr) => arr.forEach((w,i)=> ws.getColumn(i+1).width = w);
  const f = (formula, result) => result==null || result==='' ? {formula} : {formula, result};
  const GRADE_F = p => `IF(${p}>=80,4,IF(${p}>=75,3.5,IF(${p}>=70,3,IF(${p}>=65,2.5,IF(${p}>=60,2,IF(${p}>=55,1.5,IF(${p}>=50,1,0)))))))`;

  /* ---- 1) สรุปผล ---- */
  {
    const H = ['เลขที่','รหัส','ชื่อ-สกุล','คะแนนงาน','คะแนนเสริม',`รวม\n(เต็ม ${fmt(max)})`,'ร้อยละ','เกรด','อันดับ','มาเรียน %','ขาด','ลา','สาย','ส่งงาน','หมายเหตุ'];
    const ws = sheet('สรุปผล', H.length, 3, 3); head(ws, 3, H);
    students.forEach((s,i)=>{ const st = stats.get(s.id); const r = 4+i;
      const sent = tasks.filter(t=>{ const val=c.scores[t.id]?.[s.id]; return val!=null&&val!==''; }).length;
      const g = st.ms ? 'มส' : (st.grade==null ? '' : +st.grade);
      const note = [tasks.length-sent>0 ? `ค้าง ${tasks.length-sent} งาน` : '', st.ms ? 'เวลาเรียนไม่ถึง 80%' : ''].filter(Boolean).join(', ');
      put(ws, r, [s.no===''?'':(+s.no||s.no), s.code, s.name, r1(st.raw), st.bonus||'', f(`D${r}+N(E${r})`, r1(st.total)), r1(st.pct), g, max?rankOf.get(s.id):'',
        st.att.pct==null?'':r1(st.att.pct), st.att.A, st.att.L, st.att.S, tasks.length?`${sent}/${tasks.length}`:'', note], {left:[2,14], zebra:i%2});
      if(g!=='') ws.getCell(r,8).fill = fill(GC[String(g)]); ws.getCell(r,8).font = {name:F,size:SZ,bold:true}; ws.getCell(r,6).font = {name:F,size:SZ,bold:true};
    });
    const last = 3+students.length;
    if(students.length){
      const pcts = students.map(s=>stats.get(s.id).pct), tots = students.map(s=>stats.get(s.id).total);
      [['ค่าเฉลี่ย','AVERAGE', a=>a.reduce((x,y)=>x+y,0)/a.length], ['สูงสุด','MAX', a=>Math.max(...a)], ['ต่ำสุด','MIN', a=>Math.min(...a)]].forEach(([label,fn,calc],k)=>{
        put(ws, last+1+k, ['','',label,'','', f(`ROUND(${fn}(F4:F${last}),2)`, r1(calc(tots))), f(`ROUND(${fn}(G4:G${last}),2)`, r1(calc(pcts))), '','','','','','','',''], {bold:true, left:[2], fill:'FFEEF0FF'}); });
      const g0 = last+6; ws.getCell(g0,3).value = 'การกระจายเกรด'; ws.getCell(g0,3).font = {name:F,size:SZ,bold:true};
      const grades = ['4','3.5','3','2.5','2','1.5','1','0','มส'];
      grades.forEach((g,i)=>{ const col = 4+i; const hc = ws.getCell(g0,col), vc = ws.getCell(g0+1,col);
        hc.value = g==='มส'?g:+g; hc.font = {name:F,size:SZ,bold:true}; hc.fill = fill(GC[g]); hc.alignment = {horizontal:'center'}; hc.border = border;
        const n = students.filter(s=>{ const st=stats.get(s.id); return (st.ms?'มส':st.grade)===g; }).length;
        vc.value = f(`COUNTIF($H$4:$H$${last},${g==='มส'?'"มส"':g})`, n); vc.font = {name:F,size:SZ}; vc.alignment = {horizontal:'center'}; vc.border = border; });
      ws.getCell(g0+1,3).value = 'จำนวน (คน)'; ws.getCell(g0+1,3).font = {name:F,size:SZ};
    }
    widths(ws, [8,12,34,13,13,14,11,9,9,12,8,8,8,10,26]);
  }

  /* ---- 2) คะแนน ---- */
  {
    const n = tasks.length, cB = 4+n, cT = 5+n, cP = 6+n, cG = 7+n;      // bonus / total / percent / grade columns
    const H = ['เลขที่','รหัส','ชื่อ-สกุล', ...tasks.map(t=>`${t.name}\n(${CATS[t.cat]?.name||''})`), 'คะแนนเสริม','รวม','ร้อยละ','เกรด'];
    const ws = sheet('คะแนน', H.length, 3, 4); head(ws, 3, H);
    const tRange = r => n ? `SUM(${L(4)}${r}:${L(3+n)}${r})` : '0';
    put(ws, 4, ['','','คะแนนเต็ม', ...tasks.map(t=>+t.max), '', f(tRange(4), max), 100, ''], {bold:true, left:[2], fill:'FFEEF0FF'});
    students.forEach((s,i)=>{ const st = stats.get(s.id); const r = 5+i;
      const cells = tasks.map(t=>{ const val=c.scores[t.id]?.[s.id]; return val==null||val==='' ? '' : +val; });
      put(ws, r, [s.no===''?'':(+s.no||s.no), s.code, s.name, ...cells, st.bonus||'',
        f(`${tRange(r)}+N(${L(cB)}${r})`, r1(st.total)),
        f(`IF($${L(cT)}$4>0,MIN(100,ROUND(${L(cT)}${r}/$${L(cT)}$4*100,2)),0)`, r1(st.pct)),
        max ? f(GRADE_F(`${L(cP)}${r}`), +st.grade) : ''], {left:[2], zebra:i%2});
      tasks.forEach((t,j)=>{ if(cells[j]!=='' && cells[j] > +t.max) ws.getCell(r,4+j).fill = fill('FFFECACA'); });
      ws.getCell(r,cT).font = {name:F,size:SZ,bold:true};
      if(max){ ws.getCell(r,cG).fill = fill(GC[st.grade]); ws.getCell(r,cG).font = {name:F,size:SZ,bold:true}; }
    });
    const last = 4+students.length;
    if(students.length){
      put(ws, last+1, ['','','ค่าเฉลี่ย', ...tasks.map((t,j)=>f(`IFERROR(ROUND(AVERAGE(${L(4+j)}5:${L(4+j)}${last}),2),"")`, taskAvg(c,t)==null?null:r1(taskAvg(c,t)))), '',
        f(`ROUND(AVERAGE(${L(cT)}5:${L(cT)}${last}),2)`, r1(classAvg(c,'total'))), f(`ROUND(AVERAGE(${L(cP)}5:${L(cP)}${last}),2)`, r1(classAvg(c,'pct'))), ''], {bold:true, left:[2], fill:'FFEEF0FF'});
    }
    widths(ws, [8,12,34, ...tasks.map(()=>14), 13,11,11,9]);
  }

  /* ---- 3) เช็คชื่อ ---- */
  {
    const n = dates.length, c0 = 3+n;
    const H = ['เลขที่','ชื่อ-สกุล', ...dates.map(d=>fmtDate(d,{day:'numeric',month:'short',year:'2-digit'})), 'มา','ขาด','ลา','สาย','มาเรียน %'];
    const ws = sheet('เช็คชื่อ', H.length, 2, 3); head(ws, 3, H);
    students.forEach((s,i)=>{ const a = stats.get(s.id).att; const r = 4+i;
      const cells = dates.map(d=>ATT[c.attendance[d][s.id]] || '');
      const rng = n ? `${L(3)}${r}:${L(2+n)}${r}` : null;
      const cnt = (label, val) => rng ? f(`COUNTIF(${rng},"${label}")`, val) : 0;
      put(ws, r, [s.no===''?'':(+s.no||s.no), s.name, ...cells, cnt('มา',a.P), cnt('ขาด',a.A), cnt('ลา',a.L), cnt('สาย',a.S),
        rng ? f(`IF(COUNTA(${rng})=0,"",ROUND((${L(c0)}${r}+${L(c0+3)}${r})/COUNTA(${rng})*100,1))`, a.pct==null?null:Math.round(a.pct*10)/10) : ''], {left:[1], zebra:i%2});
      cells.forEach((x,j)=>{ if(AC[x]) ws.getCell(r,3+j).fill = fill(AC[x]); });
      if(a.pct!=null && a.pct<80) ws.getCell(r,c0+4).fill = fill('FFFDA4AF');
    });
    if(!n){ ws.getCell(4+students.length+1,2).value = 'ยังไม่มีการเช็คชื่อ'; }
    widths(ws, [8,34, ...dates.map(()=>11), 8,8,8,8,12]);
  }

  /* ---- 4) คะแนนเสริม ---- */
  {
    const H = ['วันที่','เลขที่','ชื่อ-สกุล','คะแนน','เหตุผล'];
    const ws = sheet('คะแนนเสริม', H.length, 0, 3); head(ws, 3, H);
    const byId = new Map(students.map(s=>[s.id,s]));
    const log = [...c.bonus].filter(b=>byId.has(b.sid)).sort((a,b)=>a.ts-b.ts);
    log.forEach((b,i)=>{ const s = byId.get(b.sid);
      put(ws, 4+i, [fmtDate(b.date,{day:'numeric',month:'short',year:'2-digit'}), s.no===''?'':(+s.no||s.no), s.name, b.pts, b.reason||''], {left:[2,4], zebra:i%2});
      ws.getCell(4+i,4).font = {name:F,size:SZ,bold:true,color:{argb:b.pts>=0?'FF12A150':'FFE11D48'}}; });
    const last = 3+log.length;
    if(log.length) put(ws, last+1, ['','','รวมทั้งหมด', f(`SUM(D4:D${last})`, log.reduce((a,b)=>a+b.pts,0)), ''], {bold:true, left:[2], fill:'FFEEF0FF'});
    else ws.getCell(4,3).value = 'ยังไม่มีรายการ';
    widths(ws, [14,8,34,10,40]);
  }
  return wb;
}

        <td><input class="stu-in" data-f="code" value="${esc(s.code)}" aria-label="รหัสนักเรียน" style="text-align:center"></td>
        <td><input class="stu-in" data-f="name" value="${esc(s.name)}" aria-label="ชื่อ-สกุล"></td>
        <td><button class="btn sm ghost danger" data-delstu="${s.id}" aria-label="ลบ ${esc(s.name)}">✕</button></td></tr>`).join('')}
      </tbody></table></div>`:'<p class="pad muted" style="margin:0">ยังไม่มีนักเรียน เพิ่มทีละคนหรือวางรายชื่อทางขวา</p>'}
    </div>
    <aside class="card pad">
      <h2>วางรายชื่อจาก Excel</h2>
      <p class="hint" style="margin-top:0">คัดลอกคอลัมน์จาก Excel/Google Sheets มาวางได้เลย บรรทัดละ 1 คน รูปแบบ <b>เลขที่ · รหัส · ชื่อ-สกุล</b> หรือมีแค่ชื่ออย่างเดียวก็ได้</p>
      <label class="sr" for="bulk">รายชื่อนักเรียน</label>
      <textarea class="ctl" id="bulk" placeholder="1	12345	ด.ช.สมชาย ใจดี&#10;2	12346	ด.ญ.สมหญิง รักเรียน"></textarea>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn pri" data-act="bulkAdd">นำเข้ารายชื่อ</button></div>
    </aside>
  </div>`;
}
function parseBulk(text, startNo){
  const out=[]; let n=startNo;
  text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    let parts = line.split('\t').map(x=>x.trim()).filter(Boolean);
    if(parts.length===1){ const m = line.match(/^(\d{1,3})[\s.)]+(?:(\d{3,})\s+)?(.+)$/); if(m) parts=[m[1], m[2]||'', m[3]]; }
    let no='', code='', name='';
    if(parts.length>=3){ [no,code]=parts; name=parts.slice(2).join(' '); }
    else if(parts.length===2){ if(/^\d{1,3}$/.test(parts[0])) [no,name]=parts; else if(/^\d+$/.test(parts[0])) [code,name]=parts; else name=parts.join(' '); }
    else name=parts[0];
    if(/^(เลขที่|ที่|no)$/i.test(no) || /^ชื่อ/.test(name)) return; // header row
    out.push({id:uid(), no: no || String(++n), code, name});
    if(no) n = Math.max(n, +no||n);
  });
  return out;
}

function toast(msg, undo){
  const t = document.getElementById('toast');

  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), undo?5000:2400);
}

/* ================= export / import ================= */
async function download(name, content, type){
  if(window.claude?.use){
    const dl = await claude.use('downloads');
    if(dl){
      try{ await dl.save({filename:name, data:new Blob([content],{type})}); return true; }
      catch(e){ if(e?.code==='declined') return false; toast('⚠ ดาวน์โหลดไม่สำเร็จ'); return false; }
    }
  }
  const blob = new Blob([content], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  return true;
}
function exportCSV(){
  const c = C(); if(!c) return;
  const q = v => { const s=String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const head = ['เลขที่','รหัส','ชื่อ-สกุล', ...c.tasks.map(t=>`${t.name} (${t.max})`), 'คะแนนเสริม', `รวม (${maxTotal(c)})`, 'ร้อยละ', 'เกรด', 'มาเรียน%', 'ขาด', 'ลา', 'สาย'];
  const rows = sortedStudents(c).map(s=>{ const st=statOf(c,s);
    return [s.no, s.code, s.name, ...c.tasks.map(t=>c.scores[t.id]?.[s.id] ?? ''), st.bonus, r1(st.total), r1(st.pct), st.ms?'มส':(st.grade??''), st.att.pct==null?'':r1(st.att.pct), st.att.A, st.att.L, st.att.S]; });
  const csv = '﻿' + [head, ...rows].map(r=>r.map(q).join(',')).join('\r\n');
  download(`คะแนน_${c.name.replace(/[\\/:*?"<>|]/g,'-')}_${today()}.csv`, csv, 'text/csv;charset=utf-8')
    .then(ok=>{ if(ok) toast('ส่งออกไฟล์แล้ว เปิดด้วย Excel ได้ทันที'); });
}
function backup(){ download(`สำรองสมุดคะแนน_${today()}.json`, JSON.stringify(S,null,1), 'application/json').then(ok=>{ if(ok) toast('สำรองข้อมูลแล้ว'); }); }

function demo(){
  const names = ['ด.ช.กิตติพัฒน์ ใจดี','ด.ญ.กัญญารัตน์ สุขสม','ด.ช.ณัฐพล แสงทอง','ด.ญ.ธนพร ศรีสุข','ด.ช.ปิยะพงษ์ บุญมา','ด.ญ.พิมพ์ชนก วงศ์ไทย','ด.ช.ภาณุวัฒน์ มีสุข','ด.ญ.มณีรัตน์ ทองดี','ด.ช.วรวุฒิ คงมั่น','ด.ญ.ศิริพร พรหมมา','ด.ช.สิทธิชัย จันทร์เพ็ญ','ด.ญ.อรอุมา แก้วใส'];
  const c = newClass('ม.4/1 (ตัวอย่าง)', 'ส31101 สังคมศึกษา');
  c.students = names.map((n,i)=>({id:uid(), no:String(i+1), code:String(30101+i), name:n}));
  c.tasks = [{id:uid(),name:'ใบงาน 1',max:10,cat:'work'},{id:uid(),name:'แบบฝึกหัด 1',max:10,cat:'ex'},{id:uid(),name:'สอบย่อย',max:20,cat:'quiz'},{id:uid(),name:'กลางภาค',max:20,cat:'mid'}];
  c.tasks.forEach(t=>{ c.scores[t.id]={}; c.students.forEach((s,i)=>{ if(Math.random()>.08) c.scores[t.id][s.id]=Math.max(0,Math.round((t.max*(.45+((i*37)%50)/100))*2)/2); }); });
  for(let k=6;k>=1;k--){ const d=new Date(); d.setDate(d.getDate()-k*2); const iso=d.toISOString().slice(0,10); c.attendance[iso]={};
    c.students.forEach((s,i)=>{ const r=(i*7+k*3)%17; c.attendance[iso][s.id]= r===0||(i===4&&k%2)?'A':r===5?'L':r===9?'S':'P'; }); }
  c.bonus = [{id:uid(),sid:c.students[1].id,pts:2,reason:'ตอบคำถาม',date:today(),ts:Date.now()-5000},{id:uid(),sid:c.students[5].id,pts:1,reason:'ช่วยงานครู',date:today(),ts:Date.now()}];
  S.classes.push(c); S.cur=c.id; tab='scores'; save(); render();
}

const menuBtn = document.getElementById('menuBtn'), menuPop = document.getElementById('menuPop');

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act],[data-goto],[data-task],[data-att],[data-day],[data-date],[data-pts],[data-delbonus],[data-delstu],[data-stu],[data-allpts]');
  if(!el) return;
  const c = C(); const d = el.dataset;
  if(d.goto){ tab=d.goto; render(); animateView(); return; }
  if(d.stu){ studentDialog(d.stu); return; }
  if(d.allpts){ bonusAll(+d.allpts); return; }
  if(d.task){ taskDialog(c.tasks.find(t=>t.id===d.task)); return; }
  if(d.att){
    const sid = el.closest('tr').dataset.sid; const day = (c.attendance[attDate] ||= {});
    if(day[sid]===d.att) delete day[sid]; else day[sid]=d.att;
    if(!Object.keys(day).length) delete c.attendance[attDate];
    save(); const y=window.scrollY; render(); window.scrollTo(0,y);
    document.querySelector(`tr[data-sid="${sid}"] [data-att="${d.att}"][aria-pressed="true"]`)?.classList.add('pop'); return;
  }
  if(d.day!=null){ if(d.day==='0') attDate=today(); else { const x=new Date(attDate+'T00:00:00'); x.setDate(x.getDate()+ +d.day); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); attDate=x.toISOString().slice(0,10);} render(); return; }
  if(d.date){ attDate=d.date; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(d.pts){
    const sid = el.closest('tr').dataset.sid;
    if(d.pts==='custom'){
      const s = c.students.find(x=>x.id===sid);
      openDialog(`<h2>คะแนนเสริม: ${esc(s.name)}</h2>
        <div class="field"><label for="f_pts">คะแนน (ใส่ค่าติดลบเพื่อหักคะแนน)</label><input class="ctl" id="f_pts" type="number" step="0.5" required value="3"></div>
        <div class="field"><label for="f_rs">เหตุผล</label><input class="ctl" id="f_rs" list="reasons" value="${esc(bonusReason)}"></div>
        <div class="dlg-foot"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn pri">ให้คะแนน</button></div>`,
        f=>{ const p=+f.f_pts.value; if(!p) return false; setTimeout(()=>addBonus(sid,p,f.f_rs.value.trim()),0); });
      document.getElementById('f_pts').select();
    } else { floatPts(el, +d.pts); addBonus(sid, +d.pts); }
    return;
  }
  if(d.delbonus){
    const i = c.bonus.findIndex(b=>b.id===d.delbonus); const b = c.bonus[i];
    c.bonus.splice(i,1); save(); render(); toast('ลบรายการแล้ว', ()=>{ c.bonus.push(b); save(); render(); }); return;
  }
  if(d.delstu){
    const i = c.students.findIndex(s=>s.id===d.delstu); const s=c.students[i];
    c.students.splice(i,1); save(); render();
    toast(`ลบ ${s.name} แล้ว`, ()=>{ c.students.splice(i,0,s); save(); render(); }); return;
  }
  closeMenu();
  switch(d.act){
    case 'newClass': classDialog(false); break;
    case 'editClass': if(c) classDialog(true); break;
    case 'demo': demo(); animateView(); break;
    case 'random': randomDialog(); break;
    case 'xlsx': exportXLSX(); break;
    case 'connect': connectDialog(); break;
    case 'openSheet': closeMenu(); window.open(SHEET_URL, '_blank', 'noopener'); break;
    case 'addTask': taskDialog(null); break;
    case 'allPresent': { const day=(c.attendance[attDate] ||= {}); c.students.forEach(s=>{ if(!day[s.id]) day[s.id]='P'; }); save(); render(); toast('เช็คมาทุกคนที่ยังไม่ได้เช็คแล้ว'); break; }
    case 'clearDay': { const old=c.attendance[attDate]; const dt=attDate; delete c.attendance[attDate]; save(); render(); toast('ล้างการเช็คชื่อวันนี้แล้ว', ()=>{ c.attendance[dt]=old; save(); render(); }); break; }
    case 'addStu': {
      const nextNo = String(c.students.reduce((m,s)=>Math.max(m,+s.no||0),0)+1);
      const s = {id:uid(), no:nextNo, code:'', name:''}; c.students.push(s); save(); render();
      setTimeout(()=>{ document.querySelector(`tr[data-sid="${s.id}"] [data-f="name"]`)?.focus(); },20); break; }
    case 'bulkAdd': {
      const txt = document.getElementById('bulk').value; const start = c.students.reduce((m,s)=>Math.max(m,+s.no||0),0);
      const add = parseBulk(txt, start); if(!add.length){ toast('ไม่พบรายชื่อ'); break; }
      c.students.push(...add); save(); render(); toast(`เพิ่มนักเรียน ${add.length} คนแล้ว`); break; }
    case 'csv': exportCSV(); break;
    case 'backup': backup(); break;
    case 'print': window.print(); break;
    case 'theme': {
      const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      r.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('scorebook.theme', r.dataset.theme)}catch(e){} break; }
    case 'delClass': {
      if(!c) break;
      askConfirm(`ลบห้อง "${c.name}"?`, 'คะแนน การเช็คชื่อ และคะแนนเสริมของห้องนี้จะถูกลบทั้งหมด แนะนำให้สำรองข้อมูลก่อน', 'ลบห้อง', ()=>{
        const i=S.classes.indexOf(c); S.classes.splice(i,1); S.cur=S.classes[0]?.id||null; save(); render();
        toast(`ลบห้อง ${c.name} แล้ว`, ()=>{ S.classes.splice(i,0,c); S.cur=c.id; save(); render(); }); });
      break; }
  }
});

let qTimer;
document.addEventListener('input', e=>{
  const t = e.target;

  if(t.id==='q'){ clearTimeout(qTimer); qTimer=setTimeout(()=>{ query=t.value; render(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },150); return; }
  if(t.id==='reason'){ bonusReason=t.value; return; }
  if(t.classList.contains('stu-in')){
    const s = C().students.find(x=>x.id===t.closest('tr').dataset.sid); s[t.dataset.f] = t.value.trim(); save();
  }
});
document.addEventListener('focusin', e=>{ if(e.target.classList?.contains('cell')) e.target.select(); });
document.addEventListener('paste', e=>{
  const t = e.target; if(!t.classList?.contains('cell')) return;
  const txt = (e.clipboardData?.getData('text') || '').replace(/\r/g,'').replace(/\n+$/,'');
  if(!/[\n\t]/.test(txt)) return;
  e.preventDefault();
  const r0 = +t.dataset.r, c0 = +t.dataset.c; let n = 0;
  txt.split('\n').forEach((row,i)=>row.split('\t').forEach((val,j)=>{
    const cell = document.querySelector(`#scoreGrid .cell[data-r="${r0+i}"][data-c="${c0+j}"]`);
    if(cell){ cell.value = val.trim(); onScoreInput(cell); n++; } }));
  toast(`วางคะแนน ${n} ช่องแล้ว`);
});

document.addEventListener('keydown', e=>{
  const t = e.target;
  if(t.classList?.contains('cell')){
    const k = e.key;
    if(k==='Enter' || k==='ArrowDown'){ e.preventDefault(); if(!moveCell(t, e.shiftKey?-1:1, 0) && k==='Enter') moveCell(t, -(+t.dataset.r), 1); }
    else if(k==='ArrowUp'){ e.preventDefault(); moveCell(t,-1,0); }
    else if(k==='ArrowRight' && t.selectionEnd===t.value.length){ if(moveCell(t,0,1)) e.preventDefault(); }
    else if(k==='ArrowLeft' && t.selectionStart===0 && t.selectionEnd===0 || k==='ArrowLeft' && t.selectionEnd-t.selectionStart===t.value.length){ if(moveCell(t,0,-1)) e.preventDefault(); }
    else if(k==='Escape'){ t.blur(); }
  }
  if(t.classList?.contains('stu-in') && e.key==='Enter'){
    e.preventDefault();
    const tr=t.closest('tr'); const nxt=tr.nextElementSibling?.querySelector(`[data-f="${t.dataset.f}"]`);
    if(nxt) nxt.focus(); else document.querySelector('[data-act="addStu"]').click();
  }
  if(t.classList?.contains('stu-in') && e.key!=='Enter'){ /* re-sort on blur only */ }
});
document.addEventListener('focusout', e=>{
  if(e.target.classList?.contains('stu-in') && e.target.dataset.f==='no' && tab==='stu'){
    setTimeout(()=>{ if(!document.activeElement?.classList.contains('stu-in')) render(); },0);
  }
});
