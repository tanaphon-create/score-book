<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดคะแนนรายห้อง</title>
<meta name="description" content="บันทึกคะแนน เช็คชื่อ และคะแนนเสริม รายห้องเรียน ใช้งานได้ทันทีแม้ออฟไลน์">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f0f2f7; --line:#e3e6ee;
  --text:#1b2133; --muted:#69708a; --brand:#4f46e5; --brand-ink:#ffffff; --brand-soft:#eef0ff;
  --ok:#16a34a; --ok-soft:#e7f7ec; --bad:#dc2626; --bad-soft:#fdecec;
  --warn:#d97706; --warn-soft:#fdf3e2; --info:#0284c7; --info-soft:#e4f3fb;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 4px 16px rgba(20,24,40,.06);
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1220; --surface:#171b2c; --surface-2:#1f2438; --line:#2a3049;
    --text:#e8eaf3; --muted:#9097b3; --brand:#818cf8; --brand-ink:#0f1220; --brand-soft:#262b4d;
    --ok:#4ade80; --ok-soft:#173326; --bad:#f87171; --bad-soft:#3a1d22;
    --warn:#fbbf24; --warn-soft:#3a2e14; --info:#38bdf8; --info-soft:#13304a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#171b2c; --surface-2:#1f2438; --line:#2a3049;
  --text:#e8eaf3; --muted:#9097b3; --brand:#818cf8; --brand-ink:#0f1220; --brand-soft:#262b4d;
  --ok:#4ade80; --ok-soft:#173326; --bad:#f87171; --bad-soft:#3a1d22;
  --warn:#fbbf24; --warn-soft:#3a2e14; --info:#38bdf8; --info-soft:#13304a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:auto}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#a855f7);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px}
.class-pick{display:flex;gap:8px;align-items:center}
select.ctl,input.ctl,textarea.ctl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 11px;min-height:40px}
select.ctl{padding-right:28px}
textarea.ctl{width:100%;min-height:140px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;min-height:40px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13.5px}
.icon-btn{width:40px;padding:0;justify-content:center}

/* ---------- tabs ---------- */
nav.tabs{max-width:1400px;margin:auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:2.5px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
main{max-width:1400px;margin:auto;padding:18px 16px 60px}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1}
.search{position:relative;min-width:200px;flex:1;max-width:340px}
.search input{width:100%;padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.info{background:var(--info-soft);color:var(--info)}
.hint{font-size:13px;color:var(--muted)}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;max-height:calc(100vh - 230px);border-radius:var(--r)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:0;text-align:center;white-space:nowrap;background:var(--surface)}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-weight:600;font-size:13px;padding:8px 6px;color:var(--muted)}
.grid tfoot td{position:sticky;bottom:0;z-index:2;background:var(--surface-2);font-weight:600;padding:8px 6px;font-size:13px}
.grid .c-no{position:sticky;left:0;z-index:2;width:52px;min-width:52px;color:var(--muted);padding:0 6px}
.grid .c-name{position:sticky;left:52px;z-index:2;text-align:left;padding:0 12px;min-width:190px;max-width:260px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.grid thead .c-no,.grid thead .c-name,.grid tfoot .c-no,.grid tfoot .c-name{z-index:4}
.grid tbody tr:hover td{background:var(--surface-2)}
.grid td.num{padding:8px 10px;font-variant-numeric:tabular-nums}
.grid .total{font-weight:700}
.task-h{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:2px 6px;border-radius:7px;color:var(--text);min-width:76px;max-width:130px}
.task-h:hover{background:var(--brand-soft)}
.task-h b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.task-h small{color:var(--muted);font-weight:500;font-size:11.5px}
.cat-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.cell{width:100%;min-width:64px;height:40px;border:0;background:transparent;text-align:center;font-variant-numeric:tabular-nums;font-size:15px;outline:none}
.cell:focus{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand);border-radius:4px}
.cell.err{background:var(--bad-soft);color:var(--bad);font-weight:700}
.cell::placeholder{color:var(--line)}
.grade{display:inline-grid;place-items:center;min-width:38px;height:26px;border-radius:7px;font-weight:700;font-size:13.5px;padding:0 6px}
.g4{background:var(--ok-soft);color:var(--ok)} .g3{background:var(--info-soft);color:var(--info)}
.g2{background:var(--warn-soft);color:var(--warn)} .g1,.g0{background:var(--bad-soft);color:var(--bad)}

/* ---------- attendance ---------- */
.att-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.datebox{display:flex;align-items:center;gap:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;min-width:52px;min-height:36px;font-weight:600;font-size:13.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].P{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].A{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].L{background:var(--info);color:#fff}
.seg button[aria-pressed="true"].S{background:var(--warn);color:#fff}
.att-list td{padding:6px 10px}
.att-list td.c-name{padding:0 12px}
.dot{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:12px;font-weight:700}
.dot.P{background:var(--ok-soft);color:var(--ok)} .dot.A{background:var(--bad);color:#fff}
.dot.L{background:var(--info-soft);color:var(--info)} .dot.S{background:var(--warn-soft);color:var(--warn)}
.date-h{border:0;background:none;color:inherit;font:inherit;font-weight:600;padding:2px 4px;border-radius:6px}
.date-h:hover,.date-h.on{background:var(--brand-soft);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat small{color:var(--muted);font-weight:500;display:block}
.stat b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- bonus ---------- */
.bonus-layout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.quick{display:flex;gap:6px;justify-content:flex-end;padding:6px 10px}
.quick .btn{min-width:44px;justify-content:center}
.plus{color:var(--ok);font-weight:700} .minus{color:var(--bad);font-weight:700}
.log{max-height:calc(100vh - 260px);overflow:auto}
.log-item{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.log-item:last-child{border-bottom:0}
.log-item .who{flex:1;min-width:0}
.log-item .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-item .who small{color:var(--muted)}
.pts{font-weight:700;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}

/* ---------- grade bar ---------- */
.dist{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-top:8px}
.dist span{height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}

/* ---------- students ---------- */
.stu-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.stu-in{border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 9px;width:100%}
.stu-in:hover{border-color:var(--line)}
.stu-in:focus{border-color:var(--brand);background:var(--surface);outline:none}
.pad{padding:16px}
h2{font-size:17px;margin:0 0 4px} h3{font-size:15px;margin:0 0 8px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:56px 20px}
.empty .big{font-size:46px;line-height:1}
.empty h2{font-size:21px;margin:14px 0 6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:420px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- dialog / menu / toast ---------- */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,12,25,.45);backdrop-filter:blur(2px)}
.dlg{padding:20px}
.dlg h2{margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13.5px;font-weight:600}
.field .ctl{width:100%}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.dlg-foot .left{margin-right:auto}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:230px;display:none;z-index:30}
.menu-pop.open{display:block}
.menu-pop button,.menu-pop label{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;padding:9px 12px;border-radius:8px;text-align:left;cursor:pointer;font-size:14px}
.menu-pop button:hover,.menu-pop label:hover{background:var(--surface-2)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:100;display:flex;gap:12px;align-items:center}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{border:0;background:none;color:var(--brand);font-weight:700;padding:0}
.saved{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;border:0;background:none;padding:6px 8px;border-radius:8px}
.saved:hover{background:var(--surface-2);color:var(--text)}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--ok)}

@media (max-width:900px){
  .bonus-layout,.stu-layout{grid-template-columns:1fr}
  .tbl-wrap{max-height:none}
  .log{max-height:360px}
}
@media (max-width:560px){
  .logo span{display:none}
  .grid .c-name{min-width:130px;max-width:150px;padding:0 8px}
  .grid .c-no{width:40px;min-width:40px}
  .grid .c-name{left:40px}
  .seg button{min-width:42px;padding:6px 8px}
  .saved{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  header.top,.toolbar,.no-print{display:none!important}
  .tbl-wrap{max-height:none;overflow:visible}
  .card{box-shadow:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo"><i aria-hidden="true">✓</i><span>สมุดคะแนน</span></div>
    <div class="class-pick" id="classPick"></div>
    <button class="saved" id="saved" data-act="connect" aria-live="polite" title="ตั้งค่าการเชื่อมต่อ Google Sheet"><i></i>บันทึกอัตโนมัติ</button>
    <div class="menu">
      <button class="btn icon-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="เมนูเพิ่มเติม">⋯</button>
      <div class="menu-pop" id="menuPop" role="menu">
        <button data-act="newClass" role="menuitem">＋ เพิ่มห้องเรียน</button>
        <button data-act="editClass" role="menuitem">✎ แก้ไขชื่อห้อง/วิชา</button>
        <hr>
        <button data-act="csv" role="menuitem">⬇ ส่งออกสรุปคะแนน (Excel/CSV)</button>
        <button data-act="backup" role="menuitem">💾 สำรองข้อมูลทั้งหมด (.json)</button>
        <label role="menuitem">📂 กู้คืนจากไฟล์สำรอง<input type="file" accept=".json,application/json" id="restoreFile" hidden></label>
        <button data-act="print" role="menuitem">🖨 พิมพ์หน้านี้</button>
        <hr>
        <button data-act="connect" role="menuitem">🔗 เชื่อมต่อ Google Sheet</button>
        <button data-act="theme" role="menuitem">◐ สลับโหมดมืด/สว่าง</button>
        <button data-act="delClass" role="menuitem" class="danger" style="color:var(--bad)">🗑 ลบห้องนี้</button>
      </div>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs" aria-label="ส่วนของสมุดคะแนน">
    <button role="tab" data-tab="scores">📝 คะแนน</button>
    <button role="tab" data-tab="att">📅 เช็คชื่อ</button>
    <button role="tab" data-tab="bonus">⭐ คะแนนเสริม</button>
    <button role="tab" data-tab="sum">📊 สรุปผล</button>
    <button role="tab" data-tab="stu">👥 นักเรียน</button>
  </nav>
</header>

<main id="view" tabindex="-1"></main>

<dialog id="dlg"><form method="dialog" class="dlg" id="dlgForm"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ================= state ================= */
const KEY = 'scorebook.v1';
const CATS = {
  work:  {name:'งาน/การบ้าน', color:'#4f46e5'},
  ex:    {name:'แบบฝึกหัด',  color:'#0ea5e9'},
  quiz:  {name:'สอบย่อย',    color:'#f59e0b'},
  mid:   {name:'สอบกลางภาค', color:'#ec4899'},
  final: {name:'สอบปลายภาค', color:'#dc2626'},
  att:   {name:'จิตพิสัย',    color:'#16a34a'}
};
const ATT = {P:'มา', A:'ขาด', L:'ลา', S:'สาย'};
const GRADE_COLORS = {'4':'#16a34a','3.5':'#22c55e','3':'#0ea5e9','2.5':'#38bdf8','2':'#f59e0b','1.5':'#fb923c','1':'#f87171','0':'#dc2626'};

let S = load();
let tab = 'scores';
let attDate = today();
let query = '';
let bonusReason = 'ตอบคำถาม';
let undoFn = null;

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.classes)) return d; }catch(e){}
  return {classes:[], cur:null};
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    if(API) syncSoon(); else setStatus('local');
  }, 200);
}

/* ---------- Google Sheet sync (Apps Script web app) ---------- */
const API_KEY = 'scorebook.api', BASE_KEY = 'scorebook.syncbase';
let API = (()=>{ try{ const a=JSON.parse(localStorage.getItem(API_KEY)); return a&&a.url ? a : null; }catch(e){ return null; } })();
let base = (()=>{ try{ return JSON.parse(localStorage.getItem(BASE_KEY))||{}; }catch(e){ return {}; } })();
let syncTimer, syncing = false, syncAgain = false, lastErr = null;
const hash = s => { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36)+'.'+s.length; };
const metaObj = () => ({cur:S.cur, order:S.classes.map(c=>c.id)});
function setStatus(kind, extra){
  const el = document.getElementById('saved');
  const t = new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  const m = {
    local:   ['var(--warn)', 'บันทึกในเครื่องนี้ · เชื่อม Google Sheet'],
    syncing: ['var(--info)', 'กำลังบันทึกลง Google Sheet…'],
    loading: ['var(--info)', 'กำลังโหลดจาก Google Sheet…'],
    ok:      ['var(--ok)',   'บันทึกลง Google Sheet แล้ว ' + t],
    err:     ['var(--bad)',  '⚠ ยังไม่ได้บันทึกลง Sheet (' + (extra||'ออฟไลน์') + ') · ลองใหม่']
  }[kind];
  el.innerHTML = `<i style="background:${m[0]}"></i>${m[1]}`;
  el.dataset.kind = kind;
}
async function api(body){
  const r = await fetch(API.url, {method:'POST', body: JSON.stringify({...body, pin: API.pin})});
  let j; try{ j = await r.json(); }catch(e){ throw {error:'bad_response'}; }
  if(!j.ok) throw j;
  return j;
}
function pending(){
  const changed = S.classes.filter(c => base[c.id] !== hash(JSON.stringify(c)));
  const deleted = Object.keys(base).filter(id => id!=='__meta' && !S.classes.some(c=>c.id===id));
  const metaChanged = base.__meta !== hash(JSON.stringify(metaObj()));
  return {changed, deleted, metaChanged, any: changed.length || deleted.length || metaChanged};
}
function syncSoon(){ clearTimeout(syncTimer); setStatus('syncing'); syncTimer = setTimeout(syncNow, 1200); }
async function syncNow(){
  if(!API) return;
  if(syncing){ syncAgain = true; return; }
  const p = pending();
  if(!p.any){ setStatus('ok'); return; }
  syncing = true; setStatus('syncing');
  const sent = p.changed.map(c => JSON.stringify(c));
  const meta = metaObj(), metaStr = JSON.stringify(meta);
  try{
    await api({action:'save', classes: sent.map(s=>JSON.parse(s)), deleted: p.deleted, meta});
    p.changed.forEach((c,i)=> base[c.id] = hash(sent[i]));
    p.deleted.forEach(id => delete base[id]);
    base.__meta = hash(metaStr);
    try{ localStorage.setItem(BASE_KEY, JSON.stringify(base)); }catch(e){}
    lastErr = null; setStatus('ok');
  }catch(e){
    lastErr = e; setStatus('err', e?.error==='pin' ? 'รหัสไม่ถูกต้อง' : 'ออฟไลน์');
    clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 30000);   // retry later
  }
  syncing = false;
  if(syncAgain){ syncAgain = false; syncNow(); }
}
async function pullFromSheet(){
  if(!API || syncing) return;
  if(pending().any){ await syncNow(); if(lastErr) return; }
  setStatus('loading');
  try{
    const j = await api({action:'load'});
    const list = j.classes || [], order = j.meta?.order || [];
    list.sort((a,b)=>(order.indexOf(a.id)+1||1e9)-(order.indexOf(b.id)+1||1e9));
    if(pending().any) return syncNow();           // user edited while loading; push first
    base = {}; list.forEach(c=> base[c.id] = hash(JSON.stringify(c)));
    const before = JSON.stringify(S.classes);
    S = {classes:list, cur: list.some(c=>c.id===S.cur) ? S.cur : (j.meta?.cur && list.some(c=>c.id===j.meta.cur) ? j.meta.cur : list[0]?.id || null)};
    base.__meta = hash(JSON.stringify(metaObj()));
    try{ localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(BASE_KEY, JSON.stringify(base)); }catch(e){}
    if(JSON.stringify(S.classes)!==before && !document.activeElement?.matches('input,textarea')) render();
    setStatus('ok');
  }catch(e){ lastErr = e; setStatus('err', e?.error==='pin' ? 'รหัสไม่ถูกต้อง' : 'ออฟไลน์'); }
}

/* ================= calculations ================= */
function gradeOf(p){
  if(p>=80) return '4'; if(p>=75) return '3.5'; if(p>=70) return '3'; if(p>=65) return '2.5';
  if(p>=60) return '2'; if(p>=55) return '1.5'; if(p>=50) return '1'; return '0';
}
function bonusOf(c, sid){ let t=0; for(const b of c.bonus) if(b.sid===sid) t+=b.pts; return t; }
function attOf(c, sid){
  const r = {P:0,A:0,L:0,S:0,days:0};
  for(const d in c.attendance){ const v=c.attendance[d][sid]; if(v){ r[v]++; r.days++; } }
  r.pct = r.days ? (r.P + r.S) / r.days * 100 : null;
  return r;
}
function maxTotal(c){ return c.tasks.reduce((a,t)=>a+(+t.max||0),0); }
function statOf(c, s){
  let raw = 0;
  for(const t of c.tasks){ const v = c.scores[t.id]?.[s.id]; if(v!=null && v!=='') raw += +v; }
  const bonus = bonusOf(c, s.id);
  const max = maxTotal(c);
  const total = raw + bonus;
  const pct = max ? Math.min(100, total/max*100) : 0;
  const att = attOf(c, s.id);
  const ms = att.pct!=null && att.pct < 80;
  return {raw, bonus, total, max, pct, grade: max ? gradeOf(pct) : null, att, ms};
}

function parseBulk(text, startNo){
  const out=[]; let n=startNo;
  text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    let parts = line.split('\t').map(x=>x.trim()).filter(Boolean);
    if(parts.length===1){ const m = line.match(/^(\d{1,3})[\s.)]+(?:(\d{3,})\s+)?(.+)$/); if(m) parts=[m[1], m[2]||'', m[3]]; }
    let no='', code='', name='';
    if(parts.length>=3){ [no,code]=parts; name=parts.slice(2).join(' '); }
    else if(parts.length===2){ if(/^\d{1,3}$/.test(parts[0])) [no,name]=parts; else if(/^\d+$/.test(parts[0])) [code,name]=parts; else name=parts.join(' '); }
    else name=parts[0];
    if(/^(เลขที่|ที่|no)$/i.test(no) || /^ชื่อ/.test(name)) return; // header row
    out.push({id:uid(), no: no || String(++n), code, name});
    if(no) n = Math.max(n, +no||n);
  });
  return out;
}

/* ================= export / import ================= */
async function download(name, content, type){
  if(window.claude?.use){
    const dl = await claude.use('downloads');
    if(dl){
      try{ await dl.save({filename:name, data:new Blob([content],{type})}); return true; }
      catch(e){ if(e?.code==='declined') return false; toast('⚠ ดาวน์โหลดไม่สำเร็จ'); return false; }
    }
  }
  const blob = new Blob([content], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  return true;
}
function exportCSV(){
  const c = C(); if(!c) return;
  const q = v => { const s=String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const head = ['เลขที่','รหัส','ชื่อ-สกุล', ...c.tasks.map(t=>`${t.name} (${t.max})`), 'คะแนนเสริม', `รวม (${maxTotal(c)})`, 'ร้อยละ', 'เกรด', 'มาเรียน%', 'ขาด', 'ลา', 'สาย'];
  const rows = sortedStudents(c).map(s=>{ const st=statOf(c,s);
    return [s.no, s.code, s.name, ...c.tasks.map(t=>c.scores[t.id]?.[s.id] ?? ''), st.bonus, r1(st.total), r1(st.pct), st.ms?'มส':(st.grade??''), st.att.pct==null?'':r1(st.att.pct), st.att.A, st.att.L, st.att.S]; });
  const csv = '﻿' + [head, ...rows].map(r=>r.map(q).join(',')).join('\r\n');
  download(`คะแนน_${c.name.replace(/[\\/:*?"<>|]/g,'-')}_${today()}.csv`, csv, 'text/csv;charset=utf-8')
    .then(ok=>{ if(ok) toast('ส่งออกไฟล์แล้ว เปิดด้วย Excel ได้ทันที'); });
}

  }
  if(d.delstu){
    const i = c.students.findIndex(s=>s.id===d.delstu); const s=c.students[i];
    c.students.splice(i,1); save(); render();
    toast(`ลบ ${s.name} แล้ว`, ()=>{ c.students.splice(i,0,s); save(); render(); }); return;
  }
  closeMenu();
  switch(d.act){
    case 'newClass': classDialog(false); break;
    case 'editClass': if(c) classDialog(true); break;
    case 'demo': demo(); break;
    case 'connect': connectDialog(); break;
    case 'addTask': taskDialog(null); break;
    case 'allPresent': { const day=(c.attendance[attDate] ||= {}); c.students.forEach(s=>{ if(!day[s.id]) day[s.id]='P'; }); save(); render(); toast('เช็คมาทุกคนที่ยังไม่ได้เช็คแล้ว'); break; }
    case 'clearDay': { const old=c.attendance[attDate]; const dt=attDate; delete c.attendance[attDate]; save(); render(); toast('ล้างการเช็คชื่อวันนี้แล้ว', ()=>{ c.attendance[dt]=old; save(); render(); }); break; }
    case 'addStu': {
      const nextNo = String(c.students.reduce((m,s)=>Math.max(m,+s.no||0),0)+1);
      const s = {id:uid(), no:nextNo, code:'', name:''}; c.students.push(s); save(); render();
      setTimeout(()=>{ document.querySelector(`tr[data-sid="${s.id}"] [data-f="name"]`)?.focus(); },20); break; }
    case 'bulkAdd': {
      const txt = document.getElementById('bulk').value; const start = c.students.reduce((m,s)=>Math.max(m,+s.no||0),0);
      const add = parseBulk(txt, start); if(!add.length){ toast('ไม่พบรายชื่อ'); break; }
      c.students.push(...add); save(); render(); toast(`เพิ่มนักเรียน ${add.length} คนแล้ว`); break; }
    case 'csv': exportCSV(); break;
    case 'backup': backup(); break;
    case 'print': window.print(); break;
    case 'theme': {
      const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      r.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('scorebook.theme', r.dataset.theme)}catch(e){} break; }
    case 'delClass': {
      if(!c) break;
      askConfirm(`ลบห้อง "${c.name}"?`, 'คะแนน การเช็คชื่อ และคะแนนเสริมของห้องนี้จะถูกลบทั้งหมด แนะนำให้สำรองข้อมูลก่อน', 'ลบห้อง', ()=>{
        const i=S.classes.indexOf(c); S.classes.splice(i,1); S.cur=S.classes[0]?.id||null; save(); render();
        toast(`ลบห้อง ${c.name} แล้ว`, ()=>{ S.classes.splice(i,0,c); S.cur=c.id; save(); render(); }); });
      break; }
  }
});

document.addEventListener('change', e=>{
  if(e.target.id==='classSel'){ S.cur=e.target.value; query=''; save(); render(); }
  if(e.target.id==='attDate' && e.target.value){ attDate=e.target.value; render(); }
});

let qTimer;
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.classList.contains('cell')) return onScoreInput(t);
  if(t.id==='q'){ clearTimeout(qTimer); qTimer=setTimeout(()=>{ query=t.value; render(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },150); return; }
  if(t.id==='reason'){ bonusReason=t.value; return; }
  if(t.classList.contains('stu-in')){
    const s = C().students.find(x=>x.id===t.closest('tr').dataset.sid); s[t.dataset.f] = t.value.trim(); save();
  }
});
document.addEventListener('focusin', e=>{ if(e.target.classList.contains('cell')) e.target.select(); });

document.addEventListener('keydown', e=>{
  const t = e.target;
  if(t.classList?.contains('cell')){
    const k = e.key;
    if(k==='Enter' || k==='ArrowDown'){ e.preventDefault(); if(!moveCell(t, e.shiftKey?-1:1, 0) && k==='Enter') moveCell(t, -(+t.dataset.r), 1); }
    else if(k==='ArrowUp'){ e.preventDefault(); moveCell(t,-1,0); }
    else if(k==='ArrowRight' && t.selectionEnd===t.value.length){ if(moveCell(t,0,1)) e.preventDefault(); }
    else if(k==='ArrowLeft' && t.selectionStart===0 && t.selectionEnd===0 || k==='ArrowLeft' && t.selectionEnd-t.selectionStart===t.value.length){ if(moveCell(t,0,-1)) e.preventDefault(); }
    else if(k==='Escape'){ t.blur(); }
  }
  if(t.classList?.contains('stu-in') && e.key==='Enter'){
    e.preventDefault();
    const tr=t.closest('tr'); const nxt=tr.nextElementSibling?.querySelector(`[data-f="${t.dataset.f}"]`);
    if(nxt) nxt.focus(); else document.querySelector('[data-act="addStu"]').click();
  }
  if(t.classList?.contains('stu-in') && e.key!=='Enter'){ /* re-sort on blur only */ }
});
document.addEventListener('focusout', e=>{
  if(e.target.classList?.contains('stu-in') && e.target.dataset.f==='no' && tab==='stu'){
    setTimeout(()=>{ if(!document.activeElement?.classList.contains('stu-in')) render(); },0);
  }
});

/* ================= boot ================= */
try{ const th=localStorage.getItem('scorebook.theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
if(!S.cur && S.classes[0]) S.cur = S.classes[0].id;
render();
if(API) pullFromSheet(); else setStatus('local');
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && API) pullFromSheet(); });
window.addEventListener('pagehide', ()=>{ if(API && pending().any && navigator.sendBeacon){ const p=pending(); navigator.sendBeacon(API.url, JSON.stringify({action:'save', pin:API.pin, classes:p.changed, deleted:p.deleted, meta:metaObj()})); } });
window.addEventListener('beforeunload', ()=>{ clearTimeout(saveTimer); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} });
</script>
</body>
</html>
